<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="assets/guia.css" rel="stylesheet">
</head>
<body>

<main class="container px-3 px-lg-4 py-5" style="max-width:56rem">

  <!-- ── Encabezado ── -->
  <div class="d-flex justify-content-between align-items-start mb-5">
    <div>
      <h1 class="mb-2">Guías</h1>
      <p class="mb-0 text-body-secondary">Apuntes para ciencia de datos.</p>
    </div>
    <button class="btn btn-sm border-0 theme-btn flex-shrink-0" title="Cambiar tema">
      <i class="bi bi-moon fs-5"></i>
    </button>
  </div>

  <!-- ── Filtros ── -->
  <div class="d-flex flex-wrap gap-2 mb-4" id="filtros"></div>

  <!-- ── Tarjetas ── -->
  <div class="row row-cols-1 row-cols-md-2 g-3" id="grilla"></div>

  <footer class="pt-4 mt-5 border-top small text-body-secondary d-flex flex-wrap gap-2 justify-content-between">
    <span>By F. Suárez · 2026 · Saludos pal IFTS 24</span>
    <a href="https://github.com/fedetrus" class="text-decoration-none text-body-secondary">
      <i class="bi bi-github"></i> fedetrus
    </a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   Para agregar una guía: sumá un objeto acá y creá su carpeta.
   estado: 'lista' | 'progreso' | 'pendiente'
   ═══════════════════════════════════════════════════════════════ */
const GUIAS = [
  {
    url: 'python/index.html', emoji: '🐍', titulo: 'Python',
    resumen: 'Tipos, condicionales, bucles, errores, estructuras y funciones. Con ejercicios integradores.',
    area: 'Programación', temas: ['int / str / bool', 'for / while', 'try / except', 'def'],
    partes: '10 módulos', estado: 'lista',
  },
  {
    url: 'eda/index.html', emoji: '📊', titulo: 'Análisis Exploratorio de Datos',
    resumen: 'Qué mirar en un dataset nuevo: tipos, faltantes, distribuciones, outliers y correlación.',
    area: 'Datos', temas: ['pandas', 'seaborn', 'describe()', 'corr()'],
    partes: '11 secciones', estado: 'lista',
  },
  {
    url: 'estadistica/index.html', emoji: '🎲', titulo: 'Probabilidad y Estadística',
    resumen: 'Descriptiva, probabilidad y regresión lineal simple: qué medida usar, cómo se calcula y cómo se lee.',
    area: 'Estadística', temas: ['media / σ / CV', 'cuartiles', 'normal', 'regresión'],
    partes: '15 secciones', estado: 'lista',
  },
  {
    url: 'pandas/index.html', emoji: '🐼', titulo: 'pandas',
    resumen: 'Selección, filtrado, groupby, merge y limpieza de datos.',
    area: 'Datos', temas: ['loc / iloc', 'groupby', 'merge'],
    partes: '14 secciones', estado: 'lista',
  },
  {
    url: 'numpy/index.html', emoji: '🔢', titulo: 'NumPy',
    resumen: 'Arrays, vectorización, broadcasting y álgebra lineal: la base de todo el cálculo en Python.',
    area: 'Datos', temas: ['ndarray', 'axis', 'broadcasting', 'linalg'],
    partes: '12 secciones', estado: 'lista',
  },
  {
    url: 'sql/index.html', emoji: '🗄️', titulo: 'SQL',
    resumen: 'Consultas, filtros, joins y agregaciones, en PostgreSQL y SQL Server a la vez.',
    area: 'Bases de datos', temas: ['PostgreSQL', 'SQL Server', 'JOIN', 'GROUP BY'],
    partes: '13 secciones', estado: 'lista',
  },
];

const ESTADO = {
  lista:     { texto: 'Disponible',    icono: 'check-circle-fill', clase: 'text-primary' },
  progreso:  { texto: 'En progreso',   icono: 'three-dots',        clase: 'text-body-secondary' },
  pendiente: { texto: 'Próximamente',  icono: 'clock',             clase: 'text-body-secondary' },
};

const grilla  = document.getElementById('grilla');
const filtros = document.getElementById('filtros');

/* ── Tarjeta ── */
const tarjeta = g => {
  const e     = ESTADO[g.estado];
  const viva  = Boolean(g.url);          // se puede abrir si tiene destino
  const temas = g.temas.map(t =>
    `<span class="badge rounded-pill bg-primary-subtle text-primary fw-normal">${t}</span>`).join('');

  return `<div class="col" data-area="${g.area}">
    <div class="card h-100 ${viva ? '' : 'opacity-50'}">
      <div class="card-body d-flex flex-column">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="fs-4">${g.emoji}</span>
          <h2 class="mb-0">${g.titulo}</h2>
        </div>
        <p class="mb-3 text-body-secondary">${g.resumen}</p>
        <div class="d-flex flex-wrap gap-2 mb-3">${temas}</div>
        <div class="mt-auto d-flex align-items-center justify-content-between pt-2 border-top">
          <span class="small ${e.clase}"><i class="bi bi-${e.icono}"></i> ${e.texto}${g.partes ? ' · ' + g.partes : ''}</span>
          ${viva ? `<a href="${g.url}" class="btn btn-sm btn-outline-primary stretched-link">Abrir</a>` : ''}
        </div>
      </div>
    </div>
  </div>`;
};

/* ── Filtros por área ── */
const areas = ['Todas', ...new Set(GUIAS.map(g => g.area))];
const pintar = area => {
  grilla.innerHTML = GUIAS.filter(g => area === 'Todas' || g.area === area).map(tarjeta).join('');
  filtros.querySelectorAll('button').forEach(b =>
    b.className = `btn btn-sm ${b.textContent === area ? 'btn-primary' : 'btn-outline-secondary'}`);
};
filtros.innerHTML = areas.map(a => `<button type="button">${a}</button>`).join('');
filtros.querySelectorAll('button').forEach(b =>
  b.addEventListener('click', () => pintar(b.textContent)));
pintar('Todas');
</script>
<script src="assets/guia.js"></script>
</body>
</html>

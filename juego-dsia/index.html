  --f-texto: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;      /* lectura */
  --f-datos: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;     /* tablas y números */
  --t-pix: .625rem; --t-chico: .9375rem; --t-base: 1.0625rem;
  --e-1: .5rem; --e-2: 1rem; --e-3: 1.5rem; --e-4: 2.25rem;
  --borde-gr: 3px; --borde-fino: 2px;
  --fondo: #efe8d6; --panel: #fffaf0; --hundido: #f4eedf; --tinta: #1d1b2e; --suave: #5f5b75;
  --borde: #1d1b2e; --linea: #d3c8ad; --sombra: #c4b898; --acento: #23796f; --acento-tinta: #fff;
  --ok: #23784a; --meh: #9a6608; --bad: #b3303f; --nulo: #f1d58a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #13132a; --panel: #1d1d3a; --hundido: #17172f; --tinta: #ecebf7; --suave: #a9a7c6;
    --borde: #c9c7e3; --linea: #34345a; --sombra: #08081a; --acento: #3fc1b0; --acento-tinta: #0d0d1f;
    --ok: #5fd28c; --meh: #f2b84b; --bad: #ff7a8c; --nulo: #6f5a1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font: var(--t-base)/1.55 var(--f-texto); }
main { max-width: 44rem; margin: 0 auto; padding: var(--e-2) var(--e-2) var(--e-4); }
p { margin: 0; }
h1, h2, .pix { font-family: var(--f-titulo); font-weight: normal; line-height: 1.7; letter-spacing: .02em; }
h1 { font-size: 1rem; margin: 0; }
h2 { font-size: var(--t-pix); margin: 0 0 var(--e-2); color: var(--suave); }
.caja {
  background: var(--panel); border: var(--borde-gr) solid var(--borde);
  box-shadow: var(--borde-gr) var(--borde-gr) 0 var(--sombra);
  padding: var(--e-3) var(--e-2); margin-bottom: var(--e-3);
}
button {
  font: inherit; color: inherit; cursor: pointer; text-align: left;
  background: var(--panel); border: var(--borde-fino) solid var(--borde);
  padding: .75rem var(--e-2); min-height: 3rem;
}
button:hover { background: var(--hundido); }
button:focus-visible { outline: var(--borde-gr) dashed var(--acento); outline-offset: 2px; }
.btn-acento {
  background: var(--acento); color: var(--acento-tinta); border-color: var(--borde);
  box-shadow: var(--borde-gr) var(--borde-gr) 0 var(--sombra);
  font-family: var(--f-titulo); font-size: var(--t-pix); padding: .9rem 1.25rem;
}
.btn-acento:hover { background: var(--acento); filter: brightness(1.08); }
.btn-acento:active { transform: translate(var(--borde-gr), var(--borde-gr)); box-shadow: none; }
.btn-texto { border: 0; background: none; color: var(--acento); text-decoration: underline; padding: var(--e-1) 0; min-height: 2.75rem; }
.btn-texto:hover { background: none; }

/* Controles de sonido */
.sonido { display: flex; justify-content: flex-end; gap: var(--e-1); margin-bottom: var(--e-1); }
.sonido button { font-family: var(--f-titulo); font-size: var(--t-pix); padding: .5rem .75rem; min-height: 2.75rem; color: var(--suave); }
.sonido button[aria-pressed="true"] { color: var(--acento-tinta); background: var(--acento); border-color: var(--acento); }
.portada .botones { display: flex; flex-wrap: wrap; gap: var(--e-2); justify-content: center; margin-top: var(--e-2); }
.portada .botones .btn-acento { margin-top: 0; }

/* HUD */
.hud { display: flex; flex-wrap: wrap; gap: var(--e-1) var(--e-2); align-items: center; justify-content: space-between; margin-bottom: var(--e-2); }
.hud .pix { font-size: var(--t-pix); }
#hud-caso { color: var(--suave); }
.barra { display: inline-flex; gap: 2px; vertical-align: middle; }
.barra i { width: .5rem; height: .75rem; background: var(--linea); }
.barra i.on { background: var(--ok); }

/* Escena + diálogo: un solo bloque */
.escena { padding: 0; overflow: hidden; }
#lienzo { display: block; width: 100%; image-rendering: pixelated; aspect-ratio: 160 / 72; max-height: 15rem; object-fit: cover; }
.dialogo { display: flex; gap: var(--e-2); align-items: flex-start; padding: var(--e-2); border-top: var(--borde-gr) solid var(--borde); min-height: 6rem; }
.dialogo canvas { width: 2.25rem; height: 3rem; image-rendering: pixelated; flex: none; }
.quien { font-family: var(--f-titulo); font-size: var(--t-pix); color: var(--acento); display: block; margin-bottom: .35rem; }
#texto { cursor: pointer; max-width: 36rem; }

/* Pizarra */
.pestanas { display: flex; flex-wrap: wrap; gap: 0 var(--e-1); margin-bottom: var(--e-2); border-bottom: var(--borde-fino) solid var(--linea); }
.pestanas button { border: 0; border-bottom: var(--borde-gr) solid transparent; background: none; padding: var(--e-1) .75rem; min-height: 2.75rem;
  font-family: var(--f-titulo); font-size: var(--t-pix); color: var(--suave); margin-bottom: calc(-1 * var(--borde-fino)); }
.pestanas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--acento); }
.tabla-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font: var(--t-chico) var(--f-datos); }
th, td { border-bottom: 1px solid var(--linea); padding: .4rem .45rem; text-align: right; white-space: nowrap; }
th { color: var(--suave); font-weight: 600; border-bottom: var(--borde-fino) solid var(--borde); }
td.nulo { background: var(--nulo); text-align: center; font-weight: 600; }
.info { margin: 0; padding: 0; list-style: none; font: var(--t-chico)/1.9 var(--f-datos); }
.info b { display: inline-block; min-width: 7.5rem; font-weight: 600; }
.info .alerta { background: var(--nulo); padding: 0 .3rem; }
.graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--e-3) var(--e-2); }
.graficos figure { margin: 0; }
.graficos canvas { display: block; width: 100%; height: auto; max-height: 9rem; object-fit: contain; image-rendering: pixelated; background: var(--hundido); }
figcaption { color: var(--suave); font-size: var(--t-chico); margin-top: .35rem; line-height: 1.35; }
.chips { display: flex; flex-wrap: wrap; gap: var(--e-1); margin: 0; padding: 0; list-style: none; }
.chips li { background: var(--hundido); border: 1px solid var(--linea); padding: .2rem .6rem; font-size: var(--t-chico); }

/* Opciones */
.pregunta { font-weight: 600; margin-bottom: var(--e-2); }
.opciones { display: grid; gap: .75rem; }
.opcion { display: grid; grid-template-columns: 1fr auto; gap: var(--e-1); }
.opcion > button:first-child { display: flex; gap: .75rem; align-items: baseline; }
.num { font-family: var(--f-titulo); font-size: var(--t-pix); color: var(--suave); flex: none; }
.btn-ficha { font-family: var(--f-titulo); font-size: var(--t-pix); min-width: 3rem; text-align: center; color: var(--suave); }
.btn-ficha[aria-expanded="true"] { background: var(--hundido); color: var(--tinta); }
.opcion .marcada { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); }
.opcion .marcada:hover { background: var(--acento); }
.opcion .marcada .num { color: inherit; }
.check { flex: none; width: 1.1rem; height: 1.1rem; border: var(--borde-fino) solid currentColor; align-self: center; display: grid; place-items: center; font-size: .8rem; line-height: 1; }
.marcada .check::after { content: '✓'; font-weight: 700; }
.ficha, .por { grid-column: 1 / -1; padding: .75rem var(--e-2); font-size: var(--t-chico); }
.ficha { background: var(--hundido); border-left: var(--borde-gr) solid var(--linea); }
.por { border-left: var(--borde-gr) solid; background: var(--hundido); }
.por.ok { border-color: var(--ok); } .por.meh { border-color: var(--meh); } .por.bad { border-color: var(--bad); }
.sello { font-family: var(--f-titulo); font-size: var(--t-pix); display: block; margin-bottom: .3rem; }
.ok .sello, .sello.ok { color: var(--ok); } .meh .sello, .sello.meh { color: var(--meh); } .bad .sello, .sello.bad { color: var(--bad); }
.resuelta .opcion > button:first-child { cursor: default; }
.resuelta .opcion > button:first-child:not(.marcada):hover { background: var(--panel); }
.acciones { display: flex; flex-wrap: wrap; gap: var(--e-2); align-items: center; justify-content: flex-end; margin-top: var(--e-3); }
.veredicto { flex: 1 1 14rem; color: var(--suave); }

/* Resultado */
.matriz { display: grid; grid-template-columns: auto 1fr 1fr; gap: 3px; max-width: 22rem; text-align: center; font-family: var(--f-datos); font-size: var(--t-chico); }
.matriz div { padding: .6rem var(--e-1); }
.matriz .cab { color: var(--suave); }
.matriz .vp, .matriz .vn { background: color-mix(in srgb, var(--ok) 25%, transparent); }
.matriz .fp, .matriz .fn { background: color-mix(in srgb, var(--bad) 25%, transparent); }
.resumen { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
.resumen li { border-left: var(--borde-gr) solid var(--linea); padding-left: .75rem; }
.resumen li.ok { border-color: var(--ok); } .resumen li.meh { border-color: var(--meh); } .resumen li.bad { border-color: var(--bad); }
.consecuencias { margin: 0; padding-left: 1.2rem; display: grid; gap: var(--e-1); }
.nota { color: var(--suave); font-size: var(--t-chico); margin-top: var(--e-3); }
.portada { text-align: center; }
.portada h1 { font-size: 1.125rem; color: var(--acento); margin-bottom: var(--e-3); line-height: 1.8; }
.portada p { max-width: 32rem; margin: 0 auto var(--e-2); }
.portada .btn-acento { margin-top: var(--e-2); }
.tecla { font-family: var(--f-titulo); font-size: var(--t-pix); border: 1px solid var(--borde); padding: .1rem .3rem; }
.mt { margin-top: var(--e-3); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .btn-acento:active { transform: none; } }

/* ── Barra superior, selector de casos, libro de fichas y avisos ── */
.barra-sup { display: flex; flex-wrap: wrap; gap: var(--e-1); justify-content: space-between; margin-bottom: var(--e-1); }
.barra-sup > div { display: flex; gap: var(--e-1); }
.barra-sup button { font-family: var(--f-titulo); font-size: var(--t-pix); padding: .5rem .75rem; min-height: 2.75rem; color: var(--suave); }
.barra-sup .txt { display: none; }
@media (min-width: 30rem) { .barra-sup .txt { display: inline; } }
.barra-sup button[aria-pressed="true"] { color: var(--acento-tinta); background: var(--acento); border-color: var(--acento); }
.menu { display: grid; gap: .75rem; max-width: 22rem; margin: var(--e-3) auto 0; }
.menu button { text-align: center; font-family: var(--f-titulo); font-size: var(--t-pix); padding: 1rem; }
.menu button[aria-pressed="true"] { background: var(--hundido); }
.menu .btn-acento { padding: 1.1rem; }
.menu small { display: block; font-family: var(--f-texto); font-size: var(--t-chico); color: inherit; opacity: .85; margin-top: .4rem; }
.creditos { margin-top: var(--e-3); }
.creditos a { color: var(--acento); }
.como-jugar { max-width: 32rem; margin: var(--e-3) auto 0; text-align: left; }
.como-jugar summary { cursor: pointer; font-family: var(--f-titulo); font-size: var(--t-pix); text-align: center; padding: var(--e-1); min-height: 2.75rem; }
.como-jugar ul { padding-left: 1.2rem; display: grid; gap: var(--e-1); }
.cab-casos { display: flex; justify-content: space-between; align-items: center; gap: var(--e-2); margin-bottom: var(--e-2); }
.cab-casos h2 { margin: 0; }
.caso-tarjeta { border: var(--borde-fino) solid var(--borde); background: var(--panel); padding: .75rem var(--e-2); }
.caso-botones { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--e-1); margin-top: var(--e-1); }
.caso-botones button { flex: 1 1 auto; text-align: center; }
.casos { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: var(--e-2); margin-bottom: var(--e-3); }
.caso-tarjeta { display: grid; grid-template-columns: auto 1fr; gap: .25rem var(--e-2); align-items: start; width: 100%; }
.caso-tarjeta canvas { grid-row: span 3; width: 2.25rem; height: 3rem; image-rendering: pixelated; }
.caso-tarjeta .pix { font-size: var(--t-pix); }
.caso-tarjeta small { color: var(--suave); font-size: var(--t-chico); line-height: 1.4; }
.etiqueta { display: inline-block; font-family: var(--f-titulo); font-size: .5rem; padding: .2rem .35rem; border: 1px solid currentColor; vertical-align: middle; margin-left: .35rem; }
.etiqueta.desafio { color: var(--bad); }
.etiqueta.hecho { color: var(--ok); }
dialog.caja { max-width: 40rem; width: calc(100% - 2rem); max-height: 85vh; overflow: auto; color: var(--tinta); margin: auto; }
dialog::backdrop { background: rgb(0 0 0 / .55); }
.libro-cab { display: flex; justify-content: space-between; align-items: center; gap: var(--e-2); margin-bottom: var(--e-2); position: sticky; top: calc(-1 * var(--e-3)); background: var(--panel); padding: var(--e-1) 0; }
.libro-cab h2 { margin: 0; color: var(--tinta); }
.libro-tema { margin: var(--e-3) 0 var(--e-1); }
.libro-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--e-1); }
.libro-lista li { background: var(--hundido); border-left: var(--borde-gr) solid var(--acento); padding: .6rem .8rem; font-size: var(--t-chico); }
.libro-lista li b { display: block; }
.libro-lista li.bloqueada { border-left-color: var(--linea); color: var(--suave); }
.aviso { position: fixed; left: 50%; bottom: var(--e-3); transform: translateX(-50%); z-index: 10; max-width: calc(100% - 2rem);
  background: var(--acento); color: var(--acento-tinta); border: var(--borde-gr) solid var(--borde); padding: .75rem var(--e-2);
  font-size: var(--t-chico); box-shadow: var(--borde-gr) var(--borde-gr) 0 var(--sombra); }
.tabla-calor td { text-align: center; color: #1d1b2e; }
.tabla-calor th:first-child { text-align: left; }
.leyenda { display: flex; flex-wrap: wrap; gap: .25rem var(--e-2); margin: .35rem 0 0; padding: 0; list-style: none; font-size: var(--t-chico); color: var(--suave); }
.leyenda i { display: inline-block; width: .7rem; height: .7rem; margin-right: .3rem; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <div class="barra-sup" id="barra-sup" hidden>
    <button type="button" id="btn-menu">☰ Menú</button>
  </div>
  <header class="hud" id="hud" hidden>
    <span class="pix" id="hud-caso"></span>
    <span class="pix" id="hud-etapa"></span>
    <span class="pix">Calidad <span class="barra" id="hud-calidad" role="img"></span></span>
  </header>

  <section class="caja escena">
    <canvas id="lienzo" width="160" height="72" aria-hidden="true"></canvas>
    <div class="dialogo" aria-live="polite">
      <canvas id="retrato" width="12" height="16" aria-hidden="true"></canvas>
      <div><span class="quien" id="quien"></span><p id="texto"></p></div>
    </div>
  </section>

  <div id="contenido"></div>
</main>

<dialog id="libro" class="caja" aria-labelledby="libro-titulo">
  <div class="libro-cab"><h2 id="libro-titulo">Libro de fichas</h2><button type="button" id="cerrar-libro">Cerrar ✕</button></div>
  <div id="libro-cuerpo"></div>
</dialog>
<div class="aviso" id="aviso" role="status" hidden></div>

<script>
'use strict';
/* ════════════ Utilidades ════════════ */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const html = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content; };
const pct = (x) => `${Math.round(x * 100)} %`;
const num = (x, dec = 0) => x.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

function azar(semilla) {               // mulberry32: misma semilla, mismos datos
  return () => {
    semilla = semilla + 0x6D2B79F5 | 0;
    let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const mezclar = (lista) => lista.map((x) => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(([, x]) => x);
const normal = (r, media, desvio) => media + desvio * Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const media = (v) => v.reduce((a, b) => a + b, 0) / v.length;
const mediana = (v) => { const s = [...v].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function correlacion(a, b) {
  const ma = media(a), mb = media(b);
  let num_ = 0, da = 0, db = 0;
  a.forEach((x, i) => { num_ += (x - ma) * (b[i] - mb); da += (x - ma) ** 2; db += (b[i] - mb) ** 2; });
  return num_ / Math.sqrt(da * db);
}

/* ════════════ Progreso guardado en el navegador ════════════ */
const Progreso = {
  clave: 'dsia-juego',
  leer() { try { return JSON.parse(localStorage.getItem(this.clave)) || {}; } catch { return {}; } },
  guardar(p) { try { localStorage.setItem(this.clave, JSON.stringify(p)); } catch { /* sin almacenamiento: se juega igual */ } },
  actualizar(cambios) { this.guardar({ ...this.leer(), ...cambios }); },
};

/* ════════════ Sonido: chiptune sintetizado con Web Audio, sin archivos ════════════ */
const Sonido = {
  ctx: null, musica: null, efectos: null, timer: null,
  midi: (n) => 440 * 2 ** ((n - 69) / 12),

  preparar() {                          // solo tras un toque: los navegadores bloquean el audio antes
    if (this.ctx) return this.ctx.state === 'suspended' && this.ctx.resume();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.efectos = c.createGain(); this.efectos.gain.value = .5; this.efectos.connect(c.destination);
    // Música: filtro pasa-bajos (suaviza) y un eco leve para el clima relajado
    const filtro = c.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 1100;
    this.musica = c.createGain(); this.musica.gain.value = 0;
    this.musica.connect(filtro); filtro.connect(c.destination);
    this.eco = c.createDelay(); this.eco.delayTime.value = .42;
    const retorno = c.createGain(); retorno.gain.value = .32;
    this.eco.connect(retorno); retorno.connect(this.eco); this.eco.connect(filtro);
    document.addEventListener('visibilitychange', () => (document.hidden ? c.suspend() : c.resume()));
  },

  nota(destino, frec, inicio, dur, { tipo = 'triangle', vol = .1, ataque = .01, hasta = null } = {}) {
    const c = this.ctx, osc = c.createOscillator(), env = c.createGain();
    osc.type = tipo; osc.frequency.setValueAtTime(frec, inicio);
    if (hasta) osc.frequency.exponentialRampToValueAtTime(hasta, inicio + dur);
    env.gain.setValueAtTime(0, inicio);
    env.gain.linearRampToValueAtTime(vol, inicio + ataque);
    env.gain.exponentialRampToValueAtTime(.0001, inicio + dur);
    osc.connect(env); env.connect(destino);
    osc.start(inicio); osc.stop(inicio + dur + .05);
    return env;
  },

  /* Efectos: cada uno es una lista corta de notas [midi, retraso, duración, tipo, volumen, deslizar a] */
  EFECTOS: {
    clic:    [[76, 0, .05, 'square', .04]],
    pagina:  [[84, 0, .06, 'triangle', .06], [88, .05, .08, 'triangle', .05]],
    ficha:   [[79, 0, .08], [84, .07, .08], [91, .14, .25]],
    ok:      [[72, 0, .12], [76, .08, .12], [79, .16, .12], [84, .24, .3]],
    meh:     [[67, 0, .14], [67, .16, .22]],
    bad:     [[50, 0, .35, 'square', .05, 38]],
    victoria:[[72, 0, .2], [76, .18, .2], [79, .36, .2], [84, .54, .6], [79, .54, .6], [76, .54, .6]],
    derrota: [[67, 0, .3], [66, .28, .3], [65, .56, .3], [64, .84, .7]],
  },
  efecto(nombre) {
    if (!Config.efectos || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.EFECTOS[nombre].forEach(([n, d, dur, tipo = 'triangle', vol = .09, hasta]) =>
      this.nota(this.efectos, this.midi(n), t + d, dur, { tipo, vol, hasta: hasta && this.midi(hasta) }));
  },
  blip(tono) {
    if (!Config.efectos || !this.ctx) return;
    this.nota(this.efectos, tono * (1 + Math.random() * .08), this.ctx.currentTime, .035, { tipo: 'square', vol: .018 });
  },

  /* Música: acordes suaves (Fmaj7 → Em7 → Dm7 → Cmaj7) a 66 bpm, bajo y melodía pentatónica en registro medio */
  ACORDES: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]],
  PENTA: [60, 62, 64, 67, 69, 72],
  tocarMusica(on) {
    if (!this.ctx) return;
    const g = this.musica.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(on ? .8 : 0, t + (on ? 2 : .6));      // fundido de entrada/salida
    if (!on || this.timer) return;
    const corchea = 60 / 66 / 2;
    let paso = 0, proximo = t + .1;
    this.timer = setInterval(() => {
      if (!Config.musica && g.value < .01) { clearInterval(this.timer); this.timer = null; return; }
      while (proximo < this.ctx.currentTime + .4) {
        const acorde = this.ACORDES[Math.floor(paso / 8) % 4], enCompas = paso % 8;
        if (enCompas === 0) acorde.forEach((n) => this.nota(this.musica, this.midi(n), proximo, corchea * 8.5, { vol: .022, ataque: 1.2 }));
        if (enCompas === 0 || enCompas === 4) this.nota(this.musica, this.midi(acorde[0] - 12), proximo, corchea * 3.5, { tipo: 'sine', vol: .07, ataque: .05 });
        if (Math.random() < .28) {
          const env = this.nota(this.musica, this.midi(this.PENTA[Math.floor(Math.random() * this.PENTA.length)]), proximo, corchea * 2.5, { tipo: 'sine', vol: .03, ataque: .05 });
          env.connect(this.eco);
        }
        paso++; proximo += corchea;
      }
    }, 100);
  },
};

const Config = {
  musica: false, efectos: true,
  cargar() { Object.assign(this, Progreso.leer().sonido); this.pintar(); },
  cambiar(clave) {
    Sonido.preparar();
    this[clave] = !this[clave];
    Progreso.actualizar({ sonido: { musica: this.musica, efectos: this.efectos } });
    this.pintar();
    if (clave === 'musica') Sonido.tocarMusica(this.musica);
    else Sonido.efecto('clic');
  },
  pintar() {
    const si = (on, plural = '') => (on ? `activada${plural}` : `apagada${plural}`);
    const musica = $('#menu-musica'), efectos = $('#menu-efectos');
    if (musica) { musica.setAttribute('aria-pressed', String(this.musica)); musica.querySelector('small').textContent = si(this.musica); }
    if (efectos) { efectos.setAttribute('aria-pressed', String(this.efectos)); efectos.querySelector('small').textContent = si(this.efectos, 's').replace('ada', 'ado'); }
  },
};

function dibujarSprite(ctx, sprite, x, y, escala = 1) {
  sprite.forEach((fila, j) => [...fila].forEach((p, i) => {
    if (p === '.') return;
    ctx.fillStyle = PALETA[p];
    ctx.fillRect(x + i * escala, y + j * escala, escala, escala);
  }));
}

const Dialogo = {
  timer: null,
  decir(sprite, nombre, texto, voz = 330) {
    const retrato = $('#retrato').getContext('2d');
    retrato.clearRect(0, 0, 12, 16); dibujarSprite(retrato, SPRITES[sprite], 0, 0);
    $('#quien').textContent = nombre;

    Escena.hablando = sprite;
    const terminar = () => { clearInterval(this.timer); p.textContent = texto; Escena.salto = 0; Escena.dibujar(); };

      i += 2; p.textContent = texto.slice(0, i);

      if (i >= texto.length) terminar();
    }, 25);
  },
};

/* ════════════ Gráficos pixelados (se calculan con los datos de cada partida) ════════════ */
const Graf = {
  lienzo(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  color: (v) => (v.startsWith('--') ? getComputedStyle(document.documentElement).getPropertyValue(v).trim() : v),
  GRUPOS: ['--acento', '--bad', '--meh', '#7b6cd9', '--ok', '#3d8fd6'],
  colorGrupo(g) { return g < 0 ? this.color('--suave') : this.color(this.GRUPOS[g % this.GRUPOS.length]); },

  /** Barras verticales: valores y colores (variables CSS o hex) */
  barras(valores, colores) {
    const c = this.lienzo(64, 32), g = c.getContext('2d'), max = Math.max(...valores) || 1;
    const ancho = Math.floor(56 / valores.length);
    valores.forEach((v, i) => {
      const h = Math.max(1, Math.round(v / max * 26));
      g.fillStyle = this.color(colores[i % colores.length]); g.fillRect(4 + i * ancho + 2, 30 - h, ancho - 4, h);
    });
    g.fillStyle = this.color('--tinta'); g.fillRect(2, 30, 60, 1);
    return c;
  },

  /** Histograma; "nulos" agrega una barra amarilla a la derecha */
  histograma(valores, nulos = 0, bins = 14) {
    const c = this.lienzo(80, 32), g = c.getContext('2d');
    const min = Math.min(...valores), max = Math.max(...valores), ancho = (max - min) / bins || 1;
    const cuentas = Array(bins).fill(0);
    valores.forEach((v) => cuentas[Math.min(bins - 1, Math.floor((v - min) / ancho))]++);
    const tope = Math.max(...cuentas, nulos);
    g.fillStyle = this.color('--acento');
    cuentas.forEach((n, i) => { const h = Math.round(n / tope * 26); g.fillRect(2 + i * 4, 30 - h, 3, h); });
    if (nulos) { const h = Math.max(2, Math.round(nulos / tope * 26)); g.fillStyle = this.color('--meh'); g.fillRect(70, 30 - h, 6, h); }
    g.fillStyle = this.color('--tinta'); g.fillRect(1, 30, 78, 1);
    return c;
  },

  /** Boxplot horizontal; los outliers (fuera de 1,5 × RIQ) en rojo */
  boxplot(valores) {
    const c = this.lienzo(80, 24), g = c.getContext('2d');
    const v = [...valores].sort((a, b) => a - b), q = (p) => v[Math.floor(p * (v.length - 1))];
    const q1 = q(.25), q2 = q(.5), q3 = q(.75), riq = q3 - q1;
    const lo = Math.max(v[0], q1 - 1.5 * riq), hi = Math.min(v.at(-1), q3 + 1.5 * riq);
    const x = (val) => Math.round(4 + (val - v[0]) / ((v.at(-1) - v[0]) || 1) * 72);
    g.fillStyle = this.color('--tinta');
    g.fillRect(x(lo), 12, x(hi) - x(lo), 1);
    g.fillRect(x(lo), 8, 1, 9); g.fillRect(x(hi), 8, 1, 9);
    g.fillStyle = this.color('--acento'); g.fillRect(x(q1), 6, Math.max(1, x(q3) - x(q1)), 13);
    g.fillStyle = this.color('--tinta'); g.fillRect(x(q2), 6, 1, 13);
    g.fillStyle = this.color('--bad');
    v.filter((a) => a < lo || a > hi).forEach((a) => g.fillRect(x(a) - 1, 11, 3, 3));
    return c;
  },

  /** Dispersión: puntos {x, y, g}; g = grupo (color), g = -1 = ruido (gris, en cruz) */
  dispersion(puntos, { ancho = 80, alto = 56 } = {}) {
    const c = this.lienzo(ancho, alto), g = c.getContext('2d');
    const xs = puntos.map((p) => p.x), ys = puntos.map((p) => p.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const px = (v) => Math.round(3 + (v - x0) / ((x1 - x0) || 1) * (ancho - 7));
    const py = (v) => Math.round(alto - 4 - (v - y0) / ((y1 - y0) || 1) * (alto - 7));
    g.fillStyle = this.color('--linea'); g.fillRect(1, alto - 2, ancho - 2, 1); g.fillRect(1, 1, 1, alto - 2);
    puntos.forEach((p) => {
      g.fillStyle = this.colorGrupo(p.g ?? 0);
      const x = px(p.x), y = py(p.y);
      if ((p.g ?? 0) < 0) { g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); }
      else g.fillRect(x - 1, y - 1, 2, 2);
    });
    return c;
  },

  /** Línea con puntos (ej.: método del codo). "marcar" resalta un índice */
  linea(valores, { marcar = -1 } = {}) {
    const c = this.lienzo(80, 40), g = c.getContext('2d'), max = Math.max(...valores), min = Math.min(...valores);
    const px = (i) => Math.round(4 + i / ((valores.length - 1) || 1) * 72);
    const py = (v) => Math.round(36 - (v - min) / ((max - min) || 1) * 32);
    g.fillStyle = this.color('--linea'); g.fillRect(2, 38, 76, 1);
    g.fillStyle = this.color('--acento');
    for (let i = 1; i < valores.length; i++) {           // segmentos pixelados
      const pasos = Math.max(Math.abs(px(i) - px(i - 1)), Math.abs(py(valores[i]) - py(valores[i - 1])));
      for (let t = 0; t <= pasos; t++) {
        g.fillRect(Math.round(px(i - 1) + (px(i) - px(i - 1)) * t / pasos), Math.round(py(valores[i - 1]) + (py(valores[i]) - py(valores[i - 1])) * t / pasos), 1, 1);
      }
    }
    valores.forEach((v, i) => {
      g.fillStyle = this.color(i === marcar ? '--bad' : '--tinta');
      g.fillRect(px(i) - 1, py(v) - 1, 3, 3);
    });
    return c;
  },
};

/* ════════════ Piezas de interfaz para las pizarras y resultados de los casos ════════════ */
function figura(lienzo, pie) {
  const f = document.createElement('figure');
  f.append(lienzo, html(`<figcaption>${pie}</figcaption>`));
  return f;
}
function graficos(...figuras) {
  const d = document.createElement('div'); d.className = 'graficos'; d.append(...figuras); return d;
}
function chips(items) { return html(`<ul class="chips">${items.map((t) => `<li>${t}</li>`).join('')}</ul>`); }
function lista(items) { return html(`<ul class="consecuencias">${items.map((t) => `<li>${t}</li>`).join('')}</ul>`); }
function nota(texto) { return html(`<p class="nota">${texto}</p>`); }
function bloque(...nodos) { const d = document.createElement('div'); d.append(...nodos); return d; }

/** df.head(): columnas y filas (arrays); null se muestra como NaN resaltado. pie: texto opcional debajo */
function tablaDatos(columnas, filas, total, pie = `df.head(): las primeras ${filas.length} de ${total} filas.`) {
  const celdas = (f) => f.map((v) => (v === null ? '<td class="nulo">NaN</td>' : `<td>${v}</td>`)).join('');
  return bloque(
    html(`<div class="tabla-scroll"><table><thead><tr>${columnas.map((c) => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${filas.map((f) => `<tr>${celdas(f)}</tr>`).join('')}</tbody></table></div>`),
    nota(pie),
  );
}

/** df.info(): [{nombre, noNulos, tipo}] */
function infoColumnas(columnas, total) {
  return bloque(
    html(`<ul class="info">${columnas.map((c) => `<li><b>${c.nombre}</b> <span class="${c.noNulos < total ? 'alerta' : ''}">${c.noNulos} no nulos</span> · ${c.tipo}</li>`).join('')}</ul>`),
    nota('df.info(): cuántos valores tiene cada columna y de qué tipo.'),
  );
}

/** Mapa de calor de correlaciones como tabla (más legible que un lienzo) */
function tablaCalor(nombres, matriz) {
  const fondo = (v) => `hsl(${v >= 0 ? 172 : 352} 55% ${Math.round(95 - Math.abs(v) * 45)}%)`;
  return bloque(
    html(`<div class="tabla-scroll"><table class="tabla-calor"><thead><tr><th></th>${nombres.map((n) => `<th>${n}</th>`).join('')}</tr></thead>
      <tbody>${matriz.map((fila, i) => `<tr><th>${nombres[i]}</th>${fila.map((v) => `<td style="background:${fondo(v)}">${num(v, 2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`),
    nota('Correlación: cerca de 1 o −1 = muy relacionadas; cerca de 0 = sin relación lineal.'),
  );
}

/** Leyenda de colores para gráficos de grupos: [[g, texto]] */
function leyenda(items) {
  return html(`<ul class="leyenda">${items.map(([g, t]) => `<li><i style="background:${Graf.colorGrupo(g)}"></i>${t}</li>`).join('')}</ul>`);
}

function pestanas(vistas) {
  const raiz = document.createElement('div');
  const barra = Object.assign(document.createElement('div'), { className: 'pestanas' });
  barra.setAttribute('role', 'tablist');
  const paneles = vistas.map(({ titulo, contenido }, i) => {
    const boton = html(`<button type="button" role="tab" aria-selected="${i === 0}">${titulo}</button>`).firstChild;
    const panel = document.createElement('div');
    panel.setAttribute('role', 'tabpanel'); panel.hidden = i > 0; panel.append(contenido);
    boton.onclick = () => {
      barra.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
      paneles.forEach((pn, j) => { pn.hidden = j !== i; });
    };
    barra.append(boton);
    return panel;
  });
  raiz.append(barra, ...paneles);
  return raiz;
}

/** Matriz de confusión con nombres de clase */
function matrizConfusion({ vp, fp, fn, vn }, positivo = 'positivo', negativo = 'negativo') {
  return html(`<div class="matriz" role="table" aria-label="Matriz de confusión">
    <div></div><div class="cab">predijo ${positivo}</div><div class="cab">predijo ${negativo}</div>
    <div class="cab">${positivo}</div><div class="vp">VP ${vp}</div><div class="fn">FN ${fn}</div>
    <div class="cab">${negativo}</div><div class="fp">FP ${fp}</div><div class="vn">VN ${vn}</div></div>`);
}
function metricasClasif({ vp, fp, fn, vn }) {
  const total = vp + fp + fn + vn, prec = vp + fp ? vp / (vp + fp) : 0, sens = vp + fn ? vp / (vp + fn) : 0;
  return { exactitud: (vp + vn) / total, precision: prec, sensibilidad: sens, f1: prec + sens ? 2 * prec * sens / (prec + sens) : 0 };
}

function agregarFichas(nuevas) {
  for (const [clave, ficha] of Object.entries(nuevas)) {
    if (FICHAS[clave]) console.error(`Ficha duplicada: ${clave}`);
    FICHAS[clave] = ficha;
  }
}

/* Caso 1 · Hospital: clasificación, nulos, desbalance, escalado según el algoritmo y sensibilidad. */

  generar(r) {
    const rasgos = { desbalance: r() < .65, nulos: r() < .6, outliers: r() < .55 };
    const pEnf = rasgos.desbalance ? .07 + r() * .04 : .38 + r() * .1;
    const filas = Array.from({ length: 200 }, () => {
      const enfermo = r() < pEnf;
      return {
        edad: Math.round(clamp(normal(r, enfermo ? 58 : 44, 12), 18, 90)),
        glucosa: Math.round(clamp(enfermo ? normal(r, 158, 30) : normal(r, 94, 11), 62, 320)),
        imc: +clamp(normal(r, enfermo ? 31 : 26, 3.5), 17, 44).toFixed(1),
        fuma: r() < (enfermo ? .4 : .2) ? 'sí' : 'no',
        diagnostico: enfermo ? 'enfermo' : 'sano',
      };
    });
    // Garantiza que cada rasgo se vea en los datos

    const reaccion = m.sensibilidad >= .85 ? '¡Excelente! Detecta a casi todos los enfermos. Lo vamos a probar en la guardia.'

const PRECIO_M2 = { Centro: 1.55, Norte: 1.8, Oeste: 1.3, Sur: 1.1 };  // miles de USD por m²
const ESTADOS = ['a refaccionar', 'bueno', 'muy bueno', 'a estrenar'];  // orden real
const FACTOR_ESTADO = { 'a refaccionar': .82, bueno: .95, 'muy bueno': 1.06, 'a estrenar': 1.16 };
const N = 300, N_PRUEBA = 60;

const mil = (x) => `US$ ${num(x)} mil`;
const usaDistancia = (alg) => alg === 'knn' || alg === 'ridge';    // KNN mide distancias; Ridge penaliza según la escala
const esRecta = (alg) => alg === 'lineal' || alg === 'ridge';

function elegirEstado(r, antiguedad) {
  if (antiguedad <= 1) return 'a estrenar';
  const p = r() - antiguedad / 120;
  return p > .55 ? 'muy bueno' : p > .15 ? 'bueno' : 'a refaccionar';
}

// m² vs precio con un color por barrio: cada barrio forma su propia franja y se ve si la nube es recta o curva
const nubeBarrios = (filas) => Graf.dispersion(filas.map((x) => ({ x: x.m2, y: x.precio, g: BARRIOS.indexOf(x.barrio) })));
const leyendaBarrios = () => leyenda(BARRIOS.map((b, i) => [i, b]));

/** Dispersión con la diagonal "predicción perfecta" dibujada encima, con la misma escala que Graf.dispersion */
function realVsPredicho(puntos) {
  const c = Graf.dispersion(puntos.map(([x, y]) => ({ x, y, g: 0 })), { ancho: 80, alto: 64 }), g = c.getContext('2d');
  const xs = puntos.map((p) => p[0]), ys = puntos.map((p) => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const px = (v) => Math.round(3 + (v - x0) / ((x1 - x0) || 1) * 73), py = (v) => Math.round(60 - (v - y0) / ((y1 - y0) || 1) * 57);
  g.fillStyle = Graf.color('--ok');
  const desde = Math.max(x0, y0), hasta = Math.min(x1, y1);
  for (let k = 0; k <= 80; k++) {
    const v = desde + (hasta - desde) * k / 80;
    g.fillRect(px(v), py(v), 1, 1);
  }
  return c;
}

              ? 'KNN mide distancias: los m² (decenas y cientos) dominarían y una diferencia de ambientes o de barrio casi no contaría.'
              : 'Ridge penaliza los coeficientes según su tamaño: sin escalar, castiga a cada variable de forma despareja según sus unidades.'];
          } },
      ],
    },
    {
      id: 'metrica', titulo: 'Métrica', habla: 'cliente',
      dialogo: () => 'Yo necesito saber cuánta plata le puede errar en una tasación, para explicárselo a los dueños. ¿Con qué número van a medir el modelo?',
      muestra: ({ datos, rasgos }) => chips([`precio mediano: ${mil(datos.medianaPrecio)}`, `precio máximo: ${mil(datos.maxPrecio)}`,
        rasgos.outliers ? `${datos.mansiones} mansiones en los datos` : 'casas de rango parecido']),
      opciones: [
        { id: 'mae', ficha: 'mae',
          evaluar: () => ['ok', 'Responde justo lo que pide Marcos: "en promedio le erra tantos miles de dólares". Está en sus unidades y no se infla por unas pocas casas.'] },
        { id: 'rmse', ficha: 'rmse',
          evaluar: ({ rasgos }) => ['meh', rasgos.outliers
            ? 'Está en dólares, pero castiga más los errores grandes: un error en una mansión lo infla y deja de representar la casa típica. Para explicarle a Marcos, el MAE es más directo.'
            : 'Está en dólares y castiga más los errores grandes, pero es menos intuitivo de explicar que el MAE.'] },
        { id: 'r2', ficha: 'r2',
          evaluar: () => ['meh', 'Dice qué parte de la variación del precio explica el modelo, pero no está en dólares: un "0,85" no le dice a Marcos cuánto puede errar.'] },
        { id: 'exactitud', ficha: 'exactitud',
          evaluar: () => ['bad', 'Es de clasificación: cuenta aciertos exactos. En regresión casi nunca acertás el precio al dólar, así que daría cerca de 0 aunque el modelo sea bueno.'] },
      ],
    },
  ],

  final({ rasgos, datos, decisiones, elegido, notas, semilla }) {
    const calidad = Juego.calidad(notas.filter((n) => n.id !== 'metrica'));
    const alg = elegido('algoritmo'), consecuencias = [];
    let error = .075 + .1 * (1 - calidad);           // error relativo típico por casa
    if (decisiones.enc_barrio === 'label' || decisiones.enc_barrio === 'ordinal') {
      error += .05; consecuencias.push('Barrio codificado con números inventó un orden: el modelo trató a Sur como "más" que Norte y mezcló barrios caros con baratos.');
    }
    if (decisiones.enc_estado === 'label') {
      error += .03; consecuencias.push('Con LabelEncoder, "a estrenar" quedó como 0: el modelo no entendió que el estado sube el precio.');
    }
    if (decisiones.limpieza === 'cero') {
      error += .03; consecuencias.push('Las antigüedades en 0 convirtieron casas viejas en nuevas y confundieron al modelo.');
    }
    if (decisiones.algoritmo === 'logistica') consecuencias.push('La regresión logística no predice precios: se perdió tiempo y se terminó usando un árbol.');
    if (esRecta(alg) && rasgos.curva) {
      error += .06; consecuencias.push('La recta no siguió la curva: subestimó las casas grandes y sobrestimó las chicas.');
    }
    if (esRecta(alg) && rasgos.outliers) {
      error += .03; consecuencias.push('Las mansiones tiraron de la recta y las predicciones de las casas comunes se corrieron.');
    }
    if (usaDistancia(alg) && decisiones.escalado === 'nada') {
      error += alg === 'knn' ? .06 : .02;
      consecuencias.push(alg === 'knn' ? 'Sin escalar, los m² dominaron la distancia: KNN buscó "vecinos" casi solo por tamaño.' : 'Sin escalar, Ridge penalizó las variables de forma despareja.');
    }
    if (usaDistancia(alg) && decisiones.escalado === 'minmax' && rasgos.outliers) {
      error += .03; consecuencias.push('MinMax con las mansiones aplastó los m² del resto de las casas cerca del 0.');
    }
    const sinSplit = decisiones.split === 'train';
    if (sinSplit) { error += .03; consecuencias.push('Sin datos de prueba, nadie vio que el modelo memorizaba: el error medido salió engañosamente bajo y en la realidad erra mucho más.'); }
    if (decisiones.metrica === 'exactitud') consecuencias.push('La exactitud dio casi 0 % porque ninguna predicción coincide al dólar: el número no le dijo nada a Marcos.');
    if (decisiones.metrica === 'r2') consecuencias.push('El R² sirve para comparar modelos, pero Marcos se quedó sin saber cuántos dólares puede errar.');

    // Simula las predicciones sobre las casas de prueba
    const r = azar(semilla + 17), prueba = datos.filas.slice(N - N_PRUEBA), mediaReal = media(prueba.map((x) => x.precio));
    // Las casas comunes erran en proporción a su precio; las pocas mansiones, más (el modelo vio pocas)
    const escalaError = (precio) => (precio > 800 ? precio * .5 : Math.min(precio, 1.5 * datos.medianaPrecio));
    const puntos = prueba.map(({ precio }) => {
      let sesgo = 0;
      if (esRecta(alg) && rasgos.curva) sesgo -= .22 * (precio - mediaReal);
      if (esRecta(alg) && rasgos.outliers && precio > 800) sesgo -= .3 * precio;

    });
    const errores = puntos.map(([y, p]) => y - p), mae = media(errores.map(Math.abs)), rmse = Math.sqrt(media(errores.map((e) => e * e)));
    const r2 = 1 - errores.reduce((a, e) => a + e * e, 0) / puntos.reduce((a, [y]) => a + (y - mediaReal) ** 2, 0);
    const relativo = mae / datos.medianaPrecio;
    // Las mansiones cuentan en las métricas, pero en los gráficos aplastarían al resto de las casas
    const comunes = puntos.filter(([y]) => y < 800), sinMansiones = comunes.length < puntos.length ? ', sin las mansiones' : '';
    const exito = !sinSplit && relativo <= .16;

    const reaccion = sinSplit ? `¿No me dijeron que le erraba unos ${mil(mae * .35)}? ¡En las primeras tasaciones le erró por ${mil(mae)}! Así no puedo confiar.`
      : relativo <= .11 ? `¡Le erra unos ${mil(mae)} por casa! Con eso puedo tasar tranquilo y explicárselo a los dueños.`
        : relativo <= .16 ? `Le erra unos ${mil(mae)} por casa. Me sirve como referencia, aunque me gustaría más precisión.`
          : `¿${mil(mae)} de error promedio? Con eso le pifio feo a los dueños. Así no lo puedo usar.`;
    const medidas = sinSplit
      ? [chips([`medido con entrenamiento: MAE ${mil(mae * .35)}`, `R² ${num(1 - (1 - r2) * .15, 2)}`]),
        html('<p class="nota mt">Pero con casas nuevas (las que vende Marcos):</p>')]
      : [];
    return {
      titulo: `Resultado en ${N_PRUEBA} casas ${sinSplit ? 'nuevas' : 'de prueba'}`,
      reaccion, exito,
      resultado: bloque(
        ...medidas,
        chips([`MAE ${mil(mae)}`, `RMSE ${mil(rmse)}`, `R² ${num(r2, 2)}`]),
        graficos(figura(realVsPredicho(comunes), `Precio real (eje x) vs predicho (eje y)${sinMansiones}. Verde: predicción perfecta`),
          figura(Graf.histograma(comunes.map(([y, p]) => y - p)), `Errores (real − predicho)${sinMansiones}: cuanto más angosto, mejor`)),
        ...(consecuencias.length ? [html('<h2 class="mt">Consecuencias</h2>'), lista(consecuencias)] : []),
      ),
    };
  },
});
})();

/* Caso 3 · Supermercado: agrupamiento, escalado, K-Means vs KNN, codo / dendrograma y storytelling. */
(() => {
agregarFichas({
  supermercado_centroides: { tema: 'Ética y comunicación', titulo: 'Tabla de centroides escalados',
    texto: 'Las coordenadas de cada centro de grupo, en las unidades del escalador (media 0, desvío 1 o mediana e IQR).' },
  supermercado_aparte: { tema: 'Limpieza', titulo: 'Analizar los outliers aparte',
    texto: 'Separar los casos atípicos reales y tratarlos como un grupo propio: se conservan, pero no deforman las distancias del resto.' },
  supermercado_borrar: { tema: 'Limpieza', titulo: 'Borrar los outliers',
    texto: 'Eliminar las filas atípicas. Tiene sentido si son errores de carga; si son casos reales, se pierde información valiosa.' },
  supermercado_grafico: { tema: 'Ética y comunicación', titulo: 'Gráfico sin narrativa',
    texto: 'Mostrar solo el visual. Revela el patrón, pero sin contexto ni acción la audiencia no sabe qué hacer con él.' },
});

// Perfiles con los que se generan los clientes. Los primeros K son los grupos reales de la partida.
const PERFILES = [
  { gasto: [190, 24], visitas: [3, 1.5], edad: [44, 9] },
  { gasto: [48, 12], visitas: [16, 2], edad: [66, 7] },
  { gasto: [30, 10], visitas: [3, 1.5], edad: [27, 6] },
  { gasto: [195, 24], visitas: [13, 2], edad: [38, 7] },
];
const ACCIONES = {
  'Mayoristas': 'precios por volumen y un vendedor que los atienda',
  'Familias frecuentes': 'programa de puntos y combos familiares',
  'Compra grande del mes': 'ofertas de fin de mes y envío a domicilio',
  'Vecinos de todos los días': 'descuentos en frescos los días de semana',
  'Ocasionales': 'cupones para que vuelvan más seguido',
};
const ESCALADORES = { standard: 'StandardScaler', robust: 'RobustScaler', minmax: 'MinMaxScaler', nada: 'sin escalar' };
const K_DE = { k2: 2, k3: 3, k4: 4, k5: 5, k8: 8, abajo: 8 };

// ── Cálculos (se repiten muchas veces por partida: se guardan en caché)
const cache = new Map();
const recordar = (clave, calcular) => { if (!cache.has(clave)) cache.set(clave, calcular()); return cache.get(clave); };

function parametros(filas, modo) {
  return ['gasto', 'visitas'].map((c) => {
    const v = filas.map((f) => f[c]), s = [...v].sort((a, b) => a - b), q = (p) => s[Math.floor(p * (s.length - 1))];
    if (modo === 'standard') { const m = media(v); return [m, Math.sqrt(media(v.map((x) => (x - m) ** 2)))]; }
    if (modo === 'minmax') return [s[0], s.at(-1) - s[0]];
    if (modo === 'robust') return [mediana(v), q(.75) - q(.25)];
    return [0, 1];
  });
}
const escalar = (filas, modo) => {
  const p = parametros(filas, modo);
  return filas.map((f) => [(f.gasto - p[0][0]) / p[0][1], (f.visitas - p[1][0]) / p[1][1]]);
};
const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;

/** K-Means con inicio k-means++ y varios arranques; devuelve el de menor inercia */
function kmeans(X, k, r) {
  let mejor = null;
  for (let arranque = 0; arranque < 6; arranque++) {
    const C = [X[Math.floor(r() * X.length)]];
    while (C.length < k) {
      const ds = X.map((x) => Math.min(...C.map((c) => d2(x, c))));
      let u = r() * ds.reduce((a, b) => a + b, 0), i = 0;
      while (i < X.length - 1 && (u -= ds[i]) > 0) i++;
      C.push(X[i]);
    }
    let lab = [];
    for (let vuelta = 0; vuelta < 60; vuelta++) {
      const nuevo = X.map((x) => C.reduce((b, c, j) => (d2(x, c) < d2(x, C[b]) ? j : b), 0));
      const cambio = nuevo.some((l, i) => l !== lab[i]);
      lab = nuevo;
      for (let j = 0; j < k; j++) {
        const m = X.filter((_, i) => lab[i] === j);
        if (m.length) C[j] = [media(m.map((p) => p[0])), media(m.map((p) => p[1]))];
      }
      if (!cambio) break;
    }
    const inercia = X.reduce((a, x, i) => a + d2(x, C[lab[i]]), 0);
    if (!mejor || inercia < mejor.inercia) mejor = { lab, C, inercia };
  }
  return mejor;
}

/** Jerárquico aglomerativo con enlace de Ward (Lance-Williams). Devuelve las fusiones en orden. */
function ward(X) {
  const n = X.length, D = Array.from({ length: n }, (_, i) => X.map((x) => d2(X[i], x)));
  const id = X.map((_, i) => i), tam = X.map(() => 1), vivo = X.map(() => true), fusiones = [];
  for (let paso = 0; paso < n - 1; paso++) {
    let a = -1, b = -1, min = Infinity;
    for (let i = 0; i < n; i++) if (vivo[i]) for (let j = i + 1; j < n; j++) if (vivo[j] && D[i][j] < min) { min = D[i][j]; a = i; b = j; }
    fusiones.push({ a: id[a], b: id[b], h: Math.sqrt(min) });
    for (let j = 0; j < n; j++) {
      if (!vivo[j] || j === a || j === b) continue;
      const t = tam[a] + tam[b] + tam[j];
      D[a][j] = D[j][a] = ((tam[a] + tam[j]) * D[a][j] + (tam[b] + tam[j]) * D[b][j] - tam[j] * min) / t;
    }
    vivo[b] = false; tam[a] += tam[b]; id[a] = n + paso;
  }
  return fusiones;
}

/** Etiquetas al cortar el dendrograma dejando k grupos */
function cortar(fusiones, n, k) {
  const padre = Array.from({ length: 2 * n - 1 }, (_, i) => i);
  const raiz = (i) => (padre[i] === i ? i : (padre[i] = raiz(padre[i])));
  fusiones.slice(0, n - k).forEach((f, p) => { padre[raiz(f.a)] = n + p; padre[raiz(f.b)] = n + p; });
  const nombres = new Map();
  return Array.from({ length: n }, (_, i) => { const r = raiz(i); if (!nombres.has(r)) nombres.set(r, nombres.size); return nombres.get(r); });
}

const escalaDe = (ctx) => ctx.decisiones.escalado ?? 'standard';
// Los mayoristas entran al agrupamiento solo si se dejaron (o se imputaron, disfrazados de clientes comunes)
const mayoristasAdentro = (ctx) => ctx.rasgos.outliers && ctx.decisiones.mayoristas === 'dejar';
const clave = (ctx) => `${ctx.semilla}|${escalaDe(ctx)}|${ctx.decisiones.mayoristas ?? '-'}`;
const gruposReales = (ctx) => ctx.rasgos.k + (mayoristasAdentro(ctx) ? 1 : 0);

function filasAgrupar(ctx) {
  return recordar(`${clave(ctx)}|filas`, () => {
    const f = ctx.datos.filas, k = ctx.rasgos.k, d = ctx.decisiones.mayoristas;
    if (!ctx.rasgos.outliers || d === 'dejar') return f;
    if (d === 'imputar') { const med = mediana(f.map((x) => x.gasto)); return f.map((x) => (x.g === k ? { ...x, gasto: med } : x)); }
    return f.filter((x) => x.g < k);
  });
}
const datosEscalados = (ctx) => recordar(`${clave(ctx)}|X`, () => escalar(filasAgrupar(ctx), escalaDe(ctx)));

/** Curva del codo (K de 1 a 8) y el K donde la caída se frena más */
function codo(ctx) {
  return recordar(`${clave(ctx)}|codo`, () => {
    const X = datosEscalados(ctx), r = azar(ctx.semilla + 17);
    const inercias = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => kmeans(X, k, r).inercia);
    let k = 2, mejor = -1;
    for (let c = 2; c <= 5; c++) {
      const razon = (inercias[c - 2] - inercias[c - 1]) / Math.max(1e-9, inercias[c - 1] - inercias[c]);
      if (razon > mejor) { mejor = razon; k = c; }
    }
    return { inercias, k };
  });
}

/** Dendrograma: fusiones (enlace de Ward) y el corte con el salto de altura más grande */
function dendro(ctx) {
  return recordar(`${clave(ctx)}|ward`, () => {
    const fusiones = ward(datosEscalados(ctx)), h = fusiones.map((f) => f.h), n = h.length + 1;
    let k = 2, mejor = -1;
    for (let c = 2; c <= 5; c++) { const salto = h[n - c] - h[n - c - 1]; if (salto > mejor) { mejor = salto; k = c; } }
    return { fusiones, k, ultimas: h.slice(-5) };
  });
}

/** Agrupamiento final con las decisiones de la partida */
function agrupar(ctx) {
  const jer = ctx.elegido('algoritmo') === 'jerarquico';
  const k = K_DE[jer ? ctx.decisiones.k_dendro : ctx.decisiones.k_codo] ?? gruposReales(ctx);
  return recordar(`${clave(ctx)}|grupos|${jer}|${k}`, () => {
    const X = datosEscalados(ctx), f = filasAgrupar(ctx);
    const lab = jer ? cortar(dendro(ctx).fusiones, X.length, k) : kmeans(X, k, azar(ctx.semilla + 99)).lab;
    const grupos = Array.from({ length: k }, (_, j) => {
      const idx = lab.flatMap((l, i) => (l === j ? [i] : [])), m = idx.map((i) => f[i]), cuentas = {};
      m.forEach((x) => { cuentas[x.g] = (cuentas[x.g] || 0) + 1; });
      return {
        j, n: m.length, gasto: media(m.map((x) => x.gasto)), visitas: media(m.map((x) => x.visitas)), edad: media(m.map((x) => x.edad)),
        centro: [0, 1].map((c) => media(idx.map((i) => X[i][c]))),
        puro: Math.max(...Object.values(cuentas)) / m.length,
      };
    }).filter((g) => g.n).sort((a, b) => b.gasto - a.gasto);   // el grupo 1 es el de mayor gasto
    const etiquetas = lab.map((l) => grupos.findIndex((g) => g.j === l));
    // Coherencia contra los perfiles con que se generaron los datos (en la vida real no se conoce).
    // Los mayoristas imputados no cuentan: ya no se distinguen de un cliente común.
    const cuenta = mayoristasAdentro(ctx) ? f.map(() => true) : f.map((x) => x.g < ctx.rasgos.k);
    const tabla = (fila, col) => {
      const t = {};
      f.forEach((x, i) => { if (cuenta[i]) { const a = fila(x, i), b = col(x, i); (t[a] ??= {})[b] = (t[a][b] || 0) + 1; } });
      return Object.values(t).map((c) => Object.values(c).sort((p, q) => q - p));
    };
    const porGrupo = tabla((_, i) => etiquetas[i], (x) => x.g), porReal = tabla((x) => x.g, (_, i) => etiquetas[i]);
    const total = cuenta.filter(Boolean).length, suma = (t) => t.reduce((a, c) => a + c[0], 0) / total;
    const segundo = (t) => t.some((c) => (c[1] || 0) > .2 * c.reduce((a, b) => a + b, 0));
    return {
      k, filas: f, etiquetas, grupos, coherencia: Math.min(suma(porGrupo), suma(porReal)),
      mezclados: segundo(porGrupo), partidos: segundo(porReal),
    };
  });
}

function nombreGrupo(g) {
  if (g.gasto >= 400) return 'Mayoristas';
  if (g.gasto >= 120) return g.visitas >= 8 ? 'Familias frecuentes' : 'Compra grande del mes';
  return g.visitas >= 8 ? 'Vecinos de todos los días' : 'Ocasionales';
}

function tablaPerfiles(grupos) {
  const filas = grupos.map((g, i) => `<tr><td><i style="display:inline-block;width:.7rem;height:.7rem;background:${Graf.colorGrupo(i)}"></i> ${i + 1}</td>
    <td>${g.n}</td><td>${num(g.gasto)}</td><td>${num(g.visitas, 1)}</td><td>${num(g.edad)}</td></tr>`).join('');
  return bloque(
    html(`<div class="tabla-scroll"><table><thead><tr><th>grupo</th><th>clientes</th><th>gasto</th><th>visitas</th><th>edad</th></tr></thead><tbody>${filas}</tbody></table></div>`),
    nota('Promedios de cada grupo: gasto en miles de $ por mes, visitas por mes, edad en años.'),
  );
}

/** Dendrograma truncado: solo las últimas fusiones (las 8 ramas más altas) */
function dibujarDendro(fusiones) {
  const ancho = 80, alto = 48, c = Graf.lienzo(ancho, alto), g = c.getContext('2d');
  const n = fusiones.length + 1, hojas = 8, arriba = fusiones.slice(n - hojas), hMax = arriba.at(-1).h;
  const nodo = (id) => (id >= n + (n - hojas) ? arriba[id - n - (n - hojas)] : null);
  const py = (h) => Math.round(alto - 3 - h / hMax * (alto - 6));
  let x = 0;
  const pos = (id) => {
    const f = nodo(id);
    if (!f) { x++; return { x: Math.round(x * ancho / (hojas + 1)), y: alto - 3 }; }
    const a = pos(f.a), b = pos(f.b), y = py(f.h);
    g.fillStyle = Graf.color('--acento');
    g.fillRect(a.x, y, 1, a.y - y + 1); g.fillRect(b.x, y, 1, b.y - y + 1);
    g.fillRect(Math.min(a.x, b.x), y, Math.abs(b.x - a.x) + 1, 1);
    return { x: Math.round((a.x + b.x) / 2), y };
  };
  pos(2 * n - 2);
  g.fillStyle = Graf.color('--linea'); g.fillRect(1, alto - 2, ancho - 2, 1);
  return c;
}

// Zoom fijo hasta 300 mil $: con mayoristas, el eje se estiraría tanto que no se verían las nubes
const dispersionDatos = (filas, etiquetas) => Graf.dispersion(filas.flatMap((f, i) => (f.gasto <= 300 ? [{ x: f.gasto, y: f.visitas, g: etiquetas ? etiquetas[i] : 0 }] : [])), { ancho: 96, alto: 60 });
const PIE_EJES = 'x: gasto mensual hasta 300 mil $ · y: visitas por mes';

// Evalúa la elección de K: vale el K que marca la curva y también el de los grupos reales
function evaluarK(ctx, k, curva, grafico) {
  const real = gruposReales(ctx), escala = escalaDe(ctx) === 'nada' ? 'sin escalar' : `con ${ESCALADORES[escalaDe(ctx)]}`;
  const mayor = mayoristasAdentro(ctx) ? ` (uno son los ${ctx.datos.mayoristas} mayoristas, tan lejos del resto que forman su propio grupo)` : '';
  const donde = grafico === 'el codo' ? 'la curva deja de bajar mucho' : 'está el salto de altura más grande';
  if (k === real) return ['ok', curva.k === real
    ? `Son ${real} grupos${mayor}: es justo donde ${donde}, y coincide con las nubes de la dispersión.`
    : `Son ${real} grupos${mayor}, como se ve en la dispersión. ${escala[0].toUpperCase() + escala.slice(1)}, ${grafico} marca ${curva.k}: la escala deformó las distancias.`];
  if (k === curva.k) return ['meh', `Es lo que marca ${grafico}, pero en la dispersión se ven ${real} grupos${mayor}. ${escala[0].toUpperCase() + escala.slice(1)}, la curva sale deformada: conviene contrastarla con los datos.`];
  const lejos = Math.min(Math.abs(k - real), Math.abs(k - curva.k));
  const efecto = k < real ? 'van a quedar grupos distintos mezclados en uno' : 'algún grupo real va a quedar partido en dos';
  return [lejos === 1 ? 'meh' : 'bad', `${curva.k === real ? `${grafico === 'el codo' ? 'El codo' : 'El salto más grande'} está en ${real}` : `En la dispersión se ven ${real} grupos`}${mayor}. Con ${k}, ${efecto}.`];
}

/* ── Datos: coordenadas u (temperatura) y v (vibración) en 0..1, después pasadas a unidades reales */
const aTemp = (u) => +(40 + 55 * u).toFixed(1), aVib = (v) => +(0.15 + 0.85 * v).toFixed(2);
const MIN_PTS = 5, RAROS_KMEANS = 10, GRUPITO = 5;

function puntoRegimen(r, g) {
  if (g.arco) {
    const a = (g.desde + (g.hasta - g.desde) * r()) * Math.PI / 180, rad = g.radio + normal(r, 0, 0.018);
    return [g.cx + rad * Math.cos(a), g.cy + rad * Math.sin(a)];
  }
  const t = (r() * 2 - 1) * g.largo, n = normal(r, 0, 0.02), a = g.angulo * Math.PI / 180;
  return [g.cx + t * Math.cos(a) - n * Math.sin(a), g.cy + t * Math.sin(a) + n * Math.cos(a)];
}

function regimenes(r, curva, tres) {
  const mov = () => (r() - 0.5) * 0.05;
  const lista = curva
    ? [{ arco: true, cx: 0.3 + mov(), cy: 0.04, radio: 0.28, desde: 25, hasta: 155 },
      { arco: true, cx: 0.6 + mov(), cy: 0.98, radio: 0.26, desde: 205, hasta: 335 }]
    : [{ cx: 0.22 + mov(), cy: 0.26 + mov(), angulo: 35, largo: 0.18 },
      { cx: 0.6 + mov(), cy: 0.72 + mov(), angulo: -18, largo: 0.17 }];
  if (tres) lista.push({ cx: 0.86 + mov(), cy: 0.28 + mov(), angulo: 78, largo: 0.15 });
  return lista;
}

/* ── Escalado, a mano para poder recalcular con lo que elige el jugador */
const cuantil = (v, p) => { const s = [...v].sort((a, b) => a - b); return s[Math.floor(p * (s.length - 1))]; };
const desvio = (v) => { const m = media(v); return Math.sqrt(media(v.map((x) => (x - m) ** 2))); };
function transformador(v, modo) {
  if (modo === 'standard') { const m = media(v), s = desvio(v); return (x) => (x - m) / s; }
  if (modo === 'minmax') { const lo = Math.min(...v), hi = Math.max(...v); return (x) => (x - lo) / (hi - lo); }
  if (modo === 'robust') { const m = mediana(v), riq = cuantil(v, 0.75) - cuantil(v, 0.25); return (x) => (x - m) / riq; }
  return (x) => x;
}
function escalar(filas, modo) {
  const ft = transformador(filas.map((f) => f.temp), modo), fv = transformador(filas.map((f) => f.vib), modo);
  return filas.map((f) => [ft(f.temp), fv(f.vib)]);
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

/* ── DBSCAN: grupos por densidad; −1 = ruido */
function dbscan(pts, eps, minPts = MIN_PTS) {
  const vecinos = pts.map((p) => pts.map((q, j) => (dist(p, q) <= eps ? j : -1)).filter((j) => j >= 0));
  const etiqueta = Array(pts.length).fill(undefined);
  let grupo = 0;
  pts.forEach((_, i) => {
    if (etiqueta[i] !== undefined) return;
    if (vecinos[i].length < minPts) { etiqueta[i] = -1; return; }
    etiqueta[i] = grupo;
    const cola = [...vecinos[i]];
    while (cola.length) {
      const j = cola.pop();
      if (etiqueta[j] === -1) etiqueta[j] = grupo;          // borde: deja de ser ruido
      if (etiqueta[j] !== undefined) continue;
      etiqueta[j] = grupo;
      if (vecinos[j].length >= minPts) cola.push(...vecinos[j]);
    }
    grupo++;
  });
  return etiqueta;
}

/* ── K-Means con varios arranques al azar (como n_init de scikit-learn) */
function kmeans(pts, k, semilla) {
  const r = azar(semilla + k * 101);
  let mejor = null;
  for (let intento = 0; intento < 8; intento++) {
    let centros = Array.from({ length: k }, () => pts[Math.floor(r() * pts.length)]);
    let etiqueta = [];
    for (let it = 0; it < 60; it++) {
      etiqueta = pts.map((p) => centros.reduce((b, c, j) => (dist(p, c) < dist(p, centros[b]) ? j : b), 0));
      centros = centros.map((c, j) => {
        const mios = pts.filter((_, i) => etiqueta[i] === j);
        return mios.length ? [media(mios.map((p) => p[0])), media(mios.map((p) => p[1]))] : c;
      });
    }
    const inercia = pts.reduce((s, p, i) => s + dist(p, centros[etiqueta[i]]) ** 2, 0);
    if (!mejor || inercia < mejor.inercia) mejor = { etiqueta, centros, inercia };
  }
  return mejor;
}

/* ── Jerárquico aglomerativo (enlace simple: sigue formas alargadas): devuelve las fusiones en orden */
function jerarquico(pts) {
  const n = pts.length, d = pts.map((p) => pts.map((q) => dist(p, q)));
  const activos = new Map(pts.map((_, i) => [i, { id: i, miembros: [i] }]));
  const fusiones = [];
  let proximo = n;
  while (activos.size > 1) {
    const cl = [...activos.values()];
    let best = [0, 1, Infinity];
    for (let a = 0; a < cl.length; a++) {
      for (let b = a + 1; b < cl.length; b++) {
        if (d[cl[a].id][cl[b].id] < best[2]) best = [a, b, d[cl[a].id][cl[b].id]];
      }
    }
    const A = cl[best[0]], B = cl[best[1]], nuevo = { id: proximo++, miembros: [...A.miembros, ...B.miembros] };
    d.forEach((fila) => fila.push(0));
    d.push(Array(d.length + 1).fill(0));
    for (const C of activos.values()) {
      if (C === A || C === B) continue;
      const v = Math.min(d[A.id][C.id], d[B.id][C.id]);
      d[nuevo.id][C.id] = v; d[C.id][nuevo.id] = v;
    }
    activos.delete(A.id); activos.delete(B.id); activos.set(nuevo.id, nuevo);
    fusiones.push({ a: A.id, b: B.id, id: nuevo.id, h: best[2], miembros: nuevo.miembros });
  }
  return fusiones;
}
/** Etiquetas al cortar dejando k grupos */
function cortar(fusiones, n, k) {
  const etiqueta = Array(n).fill(0);
  const vivos = new Map(Array.from({ length: n }, (_, i) => [i, [i]]));
  for (const f of fusiones.slice(0, n - k)) { vivos.delete(f.a); vivos.delete(f.b); vivos.set(f.id, f.miembros); }
  [...vivos.values()].forEach((m, g) => m.forEach((i) => { etiqueta[i] = g; }));
  return etiqueta;
}

/* ── Cálculos por partida, guardados para no repetirlos en cada pantalla */
const memo = new WeakMap();
function calc(datos, clave, fn) {
  if (!memo.has(datos)) memo.set(datos, {});
  const m = memo.get(datos);
  if (!(clave in m)) m[clave] = fn();
  return m[clave];
}
const espacio = (datos, modo) => calc(datos, `esp-${modo}`, () => escalar(datos.filas, modo));
const redondo = (x) => +x.toPrecision(2);

/** Medición contra la verdad del generador: cuántas fallas reales quedaron marcadas */
function medir(datos, marcadas) {
  let vp = 0, fp = 0;
  datos.filas.forEach((f, i) => { if (marcadas[i]) { if (f.falla) vp++; else fp++; } });
  return { vp, fp, fn: datos.anomalias - vp, vn: datos.filas.length - datos.anomalias - fp };
}
const f1 = (m) => (m.vp ? 2 * m.vp / (2 * m.vp + m.fp + m.fn) : 0);

/** Tres eps para la vista previa: el que mejor funciona en esta escala, uno chico y uno grande */
function opcionesEps(datos, modo) {
  return calc(datos, `eps-${modo}`, () => {
    const pts = espacio(datos, modo), dists = pts.map((p) => pts.map((q) => dist(p, q)).sort((a, b) => a - b)[MIN_PTS]);
    const base = mediana(dists);
    let mejor = { eps: base, puntaje: -1 };
    for (let f = 0.8; f <= 6; f *= 1.12) {
      const eps = redondo(base * f), m = medir(datos, dbscan(pts, eps).map((g) => g < 0));
      if (f1(m) > mejor.puntaje) mejor = { eps, puntaje: f1(m) };
    }
    // "Grande": el primero que ya une regímenes o se traga casi todas las lecturas raras
    let grande = mejor.eps * 3;
    for (let i = 0; i < 12; i++, grande *= 1.3) {
      const g = dbscan(pts, redondo(grande));
      if (new Set(g.filter((x) => x >= 0)).size < datos.regimenes || g.filter((x) => x < 0).length <= 2) break;
    }
    return { chico: redondo(mejor.eps / 2.5), adecuado: mejor.eps, grande: redondo(grande) };
  });
}
/** Las vistas A, B y C muestran los tres eps en un orden que cambia en cada partida */
const LETRAS = ['A', 'B', 'C'];
const tamanoEps = (datos, letra) => [['chico', 'adecuado', 'grande'], ['adecuado', 'grande', 'chico'], ['grande', 'chico', 'adecuado'],
  ['adecuado', 'chico', 'grande'], ['chico', 'grande', 'adecuado'], ['grande', 'adecuado', 'chico']][datos.semilla % 6][LETRAS.indexOf(letra)];
const etiquetasDbscan = (datos, modo, eps) => calc(datos, `db-${modo}-${eps}`, () => dbscan(espacio(datos, modo), eps));
const codo = (datos, modo) => calc(datos, `codo-${modo}`, () => [1, 2, 3, 4, 5, 6, 7].map((k) => kmeans(espacio(datos, modo), k, datos.semilla).inercia));
/** K del codo: donde la caída de la inercia es mucho mayor que la siguiente */
const codoK = (datos, modo) => {
  const I = codo(datos, modo);
  return [2, 3, 4, 5].reduce((mejor, k) => ((I[k - 2] - I[k - 1]) / (I[k - 1] - I[k] || 1e-9) > (I[mejor - 2] - I[mejor - 1]) / (I[mejor - 1] - I[mejor] || 1e-9) ? k : mejor), 2);
};
const fusionesDe = (datos, modo) => calc(datos, `jer-${modo}`, () => jerarquico(espacio(datos, modo)));

/** Cortes del dendrograma: cuántos grupos quedan en cada opción */
function cortes(datos, modo) {
  return calc(datos, `cortes-${modo}`, () => {
    const fus = fusionesDe(datos, modo), n = datos.filas.length;
    let salto = 2, max = -1;
    for (let k = 2; k <= 14; k++) {                       // k grupos = cortar entre las fusiones n-k-1 y n-k
      const gap = fus[n - k].h - fus[n - k - 1].h;
      if (gap > max) { max = gap; salto = k; }
    }
    return { alto: 1, salto, bajo: 40 };
  });
}

/** Lo que marca cada algoritmo como raro (true = candidata a falla) y los grupos para dibujar */
function ejecutar(ctx, algoritmo = ctx.elegido('algoritmo')) {
  const { datos, decisiones } = ctx, modo = decisiones.escalado, pts = espacio(datos, modo), n = pts.length;
  if (algoritmo === 'dbscan') {
    const eps = opcionesEps(datos, modo)[decisiones.eps ? tamanoEps(datos, decisiones.eps) : 'adecuado'];
    const g = etiquetasDbscan(datos, modo, eps);
    return { grupos: g, marcadas: g.map((x) => x < 0) };
  }
  if (algoritmo === 'kmeans') {
    const k = Number(String(decisiones.k ?? 'k3').slice(1));
    const km = calc(datos, `km-${modo}-${k}`, () => kmeans(pts, k, datos.semilla));
    const lejos = pts.map((p, i) => [dist(p, km.centros[km.etiqueta[i]]), i]).sort((a, b) => b[0] - a[0]).slice(0, RAROS_KMEANS);
    const marcadas = Array(n).fill(false);
    lejos.forEach(([, i]) => { marcadas[i] = true; });
    return { grupos: km.etiqueta.map((g, i) => (marcadas[i] ? -1 : g)), marcadas };
  }
  const k = cortes(datos, modo)[decisiones.corte ?? 'salto'];
  const et = cortar(fusionesDe(datos, modo), n, k), tam = {};
  et.forEach((g) => { tam[g] = (tam[g] || 0) + 1; });
  const marcadas = et.map((g) => tam[g] < GRUPITO);
  // Renumera los grupos grandes para que los colores no salten
  const orden = [...new Set(et.filter((g) => tam[g] >= GRUPITO))];
  return { grupos: et.map((g) => (tam[g] < GRUPITO ? -1 : orden.indexOf(g))), marcadas };
}

/** Los picos de temperatura se dibujan pegados al borde derecho para no aplastar al resto del gráfico */
const TOPE_TEMP = 100;
const dispersionDatos = (datos, grupos) => Graf.dispersion(datos.filas.map((f, i) => ({ x: Math.min(f.temp, TOPE_TEMP), y: f.vib, g: grupos ? grupos[i] : 0 })), { ancho: 96, alto: 64 });
const pieDispersion = (datos, texto) => (datos.rasgos.picos ? `${texto} (los picos de más de ${TOPE_TEMP} °C, pegados al borde derecho)` : texto);

/** Dendrograma de las últimas fusiones (las de arriba del árbol) */
function dendrograma(datos, modo) {
  const fus = fusionesDe(datos, modo), arriba = fus.slice(-14), creados = new Map(arriba.map((f) => [f.id, f]));
  const hojas = [];
  const recorrer = (id) => { if (creados.has(id)) { recorrer(creados.get(id).a); recorrer(creados.get(id).b); } else hojas.push(id); };
  recorrer(arriba.at(-1).id);
  const W = 96, H = 52, c = Graf.lienzo(W, H), g = c.getContext('2d'), tope = arriba.at(-1).h;
  const y = (h) => Math.round(H - 3 - h / tope * (H - 6));
  const altura = new Map(fus.map((f) => [f.id, f.h]));      // las hojas arrancan a la altura en que se formaron
  const pos = new Map(hojas.map((id, i) => [id, { x: Math.round(4 + i * (W - 8) / (hojas.length - 1)), y: y(altura.get(id) ?? 0) }]));
  g.fillStyle = Graf.color('--linea'); g.fillRect(1, H - 2, W - 2, 1);
  g.fillStyle = Graf.color('--acento');
  for (const f of arriba) {
    const A = pos.get(f.a), B = pos.get(f.b), yy = y(f.h);
    g.fillRect(A.x, yy, 1, A.y - yy + 1); g.fillRect(B.x, yy, 1, B.y - yy + 1);
    g.fillRect(Math.min(A.x, B.x), yy, Math.abs(B.x - A.x) + 1, 1);
    pos.set(f.id, { x: Math.round((A.x + B.x) / 2), y: yy });
  }
  return c;
}

    const realidad = datos.filas.map((f) => (f.falla ? 1 : 0));
    const nGrupos = new Set(grupos.filter((g) => g >= 0)).size;

/* Caso 5 · Banco (desafío): fraude con tarjeta. Desbalance extremo, fuga por contracargo y por
   target encoding, umbral por costos de negocio y sesgo por barrio. */
(() => {
const RUBROS = ['supermercado', 'farmacia', 'combustible', 'restaurante', 'delivery', 'indumentaria', 'calzado',
  'electrónica', 'celulares', 'joyería', 'ferretería', 'librería', 'juguetería', 'perfumería', 'óptica', 'veterinaria',

  'hotel', 'concesionaria', 'mueblería', 'electrodomésticos', 'peaje'];
const PESOS = [14, 8, 9, 9, 8, 6, 3, 3, 2, 1, 3, 2, 1, 3, 1, 2, 2, 2, 4, 1, 1, 1, 1, 1, .5, 1, 1.5, 5];
const RIESGOSOS = ['electrónica', 'celulares', 'joyería', 'apuestas online', 'tarjetas de regalo', 'pasajes aéreos'];
const CAROS = ['concesionaria', 'agencia de viajes', 'mueblería', 'electrodomésticos', 'pasajes aéreos'];
const BARRIOS = ['Centro', 'Norte', 'Sur', 'Puerto', 'Los Álamos', 'Villa Esperanza'];
const VILLA = 'Villa Esperanza';
const UMBRALES = [.1, .3, .5, .7];
const TRAMOS = [[0, 2], [2, 5], [5, 20], [20, 50], [50, 200], [200, Infinity]];

const elegir = (r, v) => v[Math.floor(r() * v.length)];
function elegirPeso(r, v, pesos) {
  let x = r() * pesos.reduce((a, b) => a + b, 0);
  for (let i = 0; i < v.length; i++) { x -= pesos[i]; if (x < 0) return v[i]; }
  return v.at(-1);
}
const plata = (x) => `$${num(Math.round(x))}`;
const pct1 = (x) => `${num(x * 100, 1)} %`;
const coma = (u) => num(u, 1);
// El motor muestra los textos de las observaciones (si/no) como cadenas, sin ctx: se leen de la partida actual.
let actual = null;

function transaccion(r, fraude, rasgos) {
  const nocheFraude = fraude && rasgos.nocturno && r() < .65;
  return {
    monto: Math.round(Math.exp(normal(r, fraude ? 11.2 : 9.8, fraude ? .7 : .9)) / 10) * 10,
    hora: nocheFraude ? Math.floor(r() * 6) : r() < .12 ? Math.floor(r() * 24) : ((Math.round(normal(r, 14.5, 4.2)) % 24) + 24) % 24,
    distancia: +clamp(Math.exp(normal(r, fraude ? (rasgos.nocturno ? 2.6 : 4.3) : 1.5, fraude ? 1.1 : .85)), .1, 2500).toFixed(1),
    rubro: fraude && r() < .65 ? elegir(r, RIESGOSOS) : elegirPeso(r, RUBROS, PESOS),
    canal: elegir(r, fraude ? ['online', 'online', 'online', 'app', 'presencial'] : ['presencial', 'presencial', 'presencial', 'online', 'online', 'app']),
    contracargo: r() < (fraude ? .95 : .003) ? 'sí' : 'no',
    barrio: fraude && rasgos.barrioPesa && r() < .4 ? VILLA : elegir(r, BARRIOS),
    fraude,
  };
}

/** Matriz del modelo en el conjunto de prueba para un umbral */
function enUmbral(prueba, u) {
  const vp = prueba.filter((t) => t.fraude && t.score >= u).length, fp = prueba.filter((t) => !t.fraude && t.score >= u).length;
  const fraudes = prueba.filter((t) => t.fraude).length;
  return { vp, fp, fn: fraudes - vp, vn: prueba.length - fraudes - fp };
}
const costo = ({ fn, fp }, { cFN, cFP }) => fn * cFN + fp * cFP;

/** Barras angostas para muchas categorías (Graf.barras no entra con más de ~12) */
function barrasFinas(valores, color = (i) => '--acento') {
  const c = Graf.lienzo(80, 32), g = c.getContext('2d'), max = Math.max(...valores) || 1;
  const paso = Math.max(2, Math.floor(76 / valores.length)), ancho = Math.max(1, paso - 1);
  valores.forEach((v, i) => {
    const h = v ? Math.max(1, Math.round(v / max * 26)) : 0;
    g.fillStyle = Graf.color(color(i)); g.fillRect(2 + i * paso, 30 - h, ancho, h);
  });
  g.fillStyle = Graf.color('--tinta'); g.fillRect(1, 30, 78, 1);
  return c;
}
const tasa = (filas) => (filas.length ? filas.filter((t) => t.fraude).length / filas.length : 0);
const tabla = (cabeza, filas) => html(`<div class="tabla-scroll"><table><thead><tr>${cabeza.map((c) => `<th>${c}</th>`).join('')}</tr></thead>
  <tbody>${filas.map((f) => `<tr>${f.map((v) => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);

function costosDe(datos, u) {
  const m = datos.umbrales.find((x) => x.u === u);
  return { ...m, total: costo(m, datos) };
}

agregarFichas({
  banco_costos: { tema: 'Métricas', titulo: 'Costo de los errores',
    texto: 'Cada celda de la matriz de confusión tiene un precio para el negocio. Costo total = FN × costo de un FN + FP × costo de un FP: el mejor umbral es el que lo minimiza.' },
});

CASOS.push({
  id: 'banco', orden: 5, nivel: 'desafio',
  nombre: 'Banco Austral',
  resumen: 'Clasificación · desbalance extremo · fuga · umbral por costos · sesgo',
  cliente: { sprite: 'banquera', nombre: 'Lic. Paz', voz: 480 },

  generar(r) {
    const rasgos = { fraudeCaro: r() < .5, nocturno: r() < .5, barrioPesa: r() < .5 };
    const n = 1500 + Math.floor(r() * 500), p = .012 + r() * .018;
    const filas = Array.from({ length: n }, () => transaccion(r, r() < p, rasgos));
    // Mínimo de fraudes para que haya con qué aprender, y al menos 6 en la prueba (filas i % 4 === 0)
    const algun = () => Math.floor(r() * n);
    while (filas.filter((t) => t.fraude).length < 22) { const i = algun(); filas[i] = transaccion(r, true, rasgos); }
    while (filas.filter((t, i) => i % 4 === 0 && t.fraude).length < 6) { const i = algun() & ~3; filas[i] = transaccion(r, true, rasgos); }
    // Compras grandes legítimas (outliers reales)
    for (let k = 0; k < Math.round(n * .01); k++) {
      const t = filas[algun()];
      if (!t.fraude) Object.assign(t, { monto: Math.round(Math.exp(normal(r, 13.6, .35)) / 100) * 100, rubro: elegir(r, CAROS) });
    }
    filas.forEach((t, i) => {
      t.prueba = i % 4 === 0;
      if (t.prueba) t.score = t.fraude ? clamp(normal(r, .63, .22), .02, .99) : (r() < .04 ? .1 + r() * .5 : clamp(-Math.log(1 - r()) * .035, 0, .99));
    });

  final({ rasgos, datos, decisiones, elegido }) {
    const base = costosDe(datos, Number(decisiones.umbral.slice(1)) / 10);
    const fraudes = datos.fraudesPrueba, legitimas = datos.prueba.length - fraudes;
    let vp = base.vp, fp = base.fp;
    const consecuencias = [];
    const fuga = decisiones.columnas === 'dejar', sesgo = ['one_hot', 'target_barrio'].includes(decisiones.sesgo);
    if (fuga) {
      vp = Math.round(fraudes * .1); fp = Math.round(fp * .3);
      consecuencias.push(`Con contracargo, en prueba detectaba ${fraudes} de ${fraudes} fraudes. En producción, al pagar, el contracargo todavía no existe: el rendimiento se desplomó.`);
    } else {
      if (decisiones.columnas === 'sinmonto') { vp -= Math.round(vp * .25); consecuencias.push('Sin el monto, el modelo perdió una de sus mejores señales.'); }
      if (decisiones.encoding === 'target_todo') { vp -= Math.round(vp * .3); consecuencias.push('El target encoding con todos los datos ya conocía los fraudes de prueba: la prueba prometía más de lo que el modelo rinde de verdad.'); }
      if (decisiones.encoding === 'label') { vp -= Math.round(vp * .15); consecuencias.push('Label encoding inventó un orden entre rubros: el modelo aprendió relaciones que no existen.'); }
      if (elegido('algoritmo') === 'arbol') { vp -= Math.min(1, vp); fp += 2; consecuencias.push('El árbol solo memorizó algunos fraudes del entrenamiento y generalizó peor.'); }
      if (elegido('algoritmo') === 'logistica' && rasgos.nocturno) { vp -= Math.round(vp * .2); consecuencias.push('La logística no captó el pico de fraudes de madrugada.'); }
      if (decisiones.metrica === 'exactitud') { vp = Math.round(vp * .3); consecuencias.push('Ajustaste el modelo por exactitud: aprendió que decir "legítima" casi siempre ya da un número altísimo.'); }
      else if (rasgos.fraudeCaro && ['precision', 'especificidad'].includes(decisiones.metrica)) { vp -= Math.round(vp * .25); consecuencias.push('Priorizaste no molestar a los honestos, que era lo barato: se escaparon fraudes caros.'); }
      else if (!rasgos.fraudeCaro && decisiones.metrica === 'sensibilidad') { fp = Math.round(fp * 1.6) + 2; consecuencias.push('Priorizaste atrapar todo el fraude, que paga el seguro: frenaste de más a clientes honestos, que era lo caro.'); }
    }
    let extraVilla = 0;
    if (sesgo) {
      extraVilla = Math.max(3, Math.round(legitimas * .01));
      fp += extraVilla;
      consecuencias.push(`${extraVilla} clientes honestos de ${VILLA} quedaron con la tarjeta frenada solo por su barrio. Llegó un reclamo formal por discriminación.`);
    }
    if (decisiones.sesgo === 'quitar') consecuencias.push('Nadie revisó los errores por barrio: si el modelo trata peor a algún grupo, el banco no se entera.');
    vp = clamp(vp, 0, fraudes); fp = clamp(fp, 0, legitimas);
    const matriz = { vp, fp, fn: fraudes - vp, vn: legitimas - fp }, m = metricasClasif(matriz);
    const conModelo = costo(matriz, datos), sinModelo = fraudes * datos.cFN, ahorro = 1 - conModelo / sinModelo;
    const exito = ahorro >= .1 && !fuga && !sesgo;
    const reaccion = fuga ? '¿En las pruebas era perfecto y ahora no frena casi nada? Esto no puede salir así.'
      : sesgo ? `Ahorramos ${pct(Math.max(0, ahorro))}, pero tenemos un reclamo por discriminación. Lo damos de baja hasta revisarlo.`
        : ahorro >= .35 ? `Nos ahorra ${pct(ahorro)} frente a no tener nada. ¡Esto sí lo llevo al directorio!`
          : exito ? `Ahorra ${pct(ahorro)}. Sirve, aunque seguro hay margen para mejorar.`
            : ahorro > 0 ? `Ahorra apenas ${pct(ahorro)}: entre errores y llamados, casi no cambia nada.`
              : 'Nos sale más caro que no tener ningún modelo. Así no.';
    return {
      titulo: `Primer mes en producción: ${num(datos.prueba.length)} compras`,
      reaccion, exito,
      resultado: bloque(
        matrizConfusion(matriz, 'fraude', 'legítima'),
        html('<div class="mt"></div>'),
        chips([`sensibilidad ${pct(m.sensibilidad)}`, `precisión ${pct(m.precision)}`, `exactitud ${pct1(m.exactitud)}`]),
        chips([`costo con modelo: ${plata(conModelo)}`, `sin modelo: ${plata(sinModelo)}`, `ahorro: ${ahorro >= 0 ? pct(ahorro) : `pierde ${pct(-ahorro)}`}`]),
        ...(consecuencias.length ? [html('<h2 class="mt">Consecuencias</h2>'), lista(consecuencias)] : []),
      ),
    };
  },
});
})();

const PLANES = ['básico', 'estándar', 'premium'];
const PAGOS = ['débito', 'tarjeta', 'efectivo', 'transferencia'];
const N = 400, PRUEBA = 80;

// Exactitud en entrenamiento y prueba según el algoritmo, el ruido de los datos y la preparación previa
function rendimiento({ rasgos, elegido, notas }, conAjuste = false) {
  const prep = Juego.calidad(notas.filter((n) => ['nulos', 'encoding', 'multicol'].includes(n.id)));
  const castigo = (1 - prep) * .08;
  let alg = elegido('algoritmo');
  const sobre = alg === 'arbol' && rasgos.ruido;
  if (conAjuste && sobre && elegido('ajuste') === 'rf') alg = 'random_forest';
  const base = {
    logistica: rasgos.ruido ? [.79, .77] : [.85, .83],
    arbol: rasgos.ruido ? [1, .7] : [.98, .91],
    random_forest: rasgos.ruido ? [.93, .83] : [.97, .9],
  }[alg];
  let [train, test] = base;
  if (conAjuste && sobre && elegido('ajuste') === 'limitar') [train, test] = [.85, .8];
  return { train, test: test - castigo, sobre, alg };
}

const mostrarFila = (f) => [f.meses, f.mensual, f.total, f.reclamos, f.plan, f.pago, f.baja];

  generar(r) {
    const rasgos = { nulosNuevos: r() < .55, totalExacto: r() < .5, ruido: r() < .55 };
    const filas = Array.from({ length: N }, () => {
      const pr = r(), plan = pr < .45 ? 'básico' : pr < .8 ? 'estándar' : 'premium';
      const pp = r(), pago = pp < .35 ? 'débito' : pp < .65 ? 'tarjeta' : pp < .85 ? 'efectivo' : 'transferencia';
      return {
        meses: r() < .04 ? 0 : Math.round(1 + 71 * r() ** 1.3),
        mensual: Math.round(clamp(normal(r, { básico: 25, estándar: 45, premium: 75 }[plan], 5), 12, 110)),
        reclamos: Math.min(7, Math.floor(-Math.log(1 - r()) * 1.3)),
        plan, pago,
      };
    });
    // Clientes nuevos garantizados (meses = 0), uno visible en df.head()
    const algun = () => 6 + Math.floor(r() * (N - 6));
    filas[3].meses = 0;
    while (filas.filter((f) => f.meses === 0).length < 10) filas[algun()].meses = 0;
    // El total es lo pagado mes a mes; con promos, un poco menos que meses × mensual
    filas.forEach((f) => { f.total = Math.round(f.meses * f.mensual * (rasgos.totalExacto ? 1 : .82 + .12 * r())); });
    // Baja: más reclamos, menos antigüedad, pago en efectivo, plan básico y clientes recién llegados
    const puntaje = filas.map((f) => .75 * f.reclamos - .035 * f.meses + (f.pago === 'efectivo' ? .6 : 0)
      + (f.plan === 'básico' ? .3 : 0) + (f.meses === 0 ? 1.2 : 0) + normal(r, 0, rasgos.ruido ? 1.4 : .6));
    const tasa = .2 + r() * .1, corte = [...puntaje].sort((a, b) => b - a)[Math.round(tasa * N) - 1];
    filas.forEach((f, i) => { f.baja = puntaje[i] >= corte ? 'sí' : 'no'; });
    // Nulos en cargo total: solo en los nuevos (todavía no les facturaron) o, si no, errores de carga al azar
    if (rasgos.nulosNuevos) filas.forEach((f) => { if (f.meses === 0) f.total = null; });
    else {
      if (filas[2].meses === 0) filas[2].meses = 7;

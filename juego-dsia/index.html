      while (filas.filter((f) => f.total === null).length < 11) { const f = filas[algun()]; if (f.meses > 0) f.total = null; }
    }
    const bajas = filas.filter((f) => f.baja === 'sí').length;
    const conTotal = filas.filter((f) => f.total !== null);
    const cols = {
      meses: conTotal.map((f) => f.meses), mensual: conTotal.map((f) => f.mensual), total: conTotal.map((f) => f.total),
      reclamos: conTotal.map((f) => f.reclamos), baja: conTotal.map((f) => (f.baja === 'sí' ? 1 : 0)),
    };
    const nombres = Object.keys(cols);
    const corr = nombres.map((a) => nombres.map((b) => (a === b ? 1 : correlacion(cols[a], cols[b]))));
    const c = (a, b) => corr[nombres.indexOf(a)][nombres.indexOf(b)];

          evaluar: (ctx) => {
            const { sobre, alg } = rendimiento(ctx);
            if (sobre) return ['ok', 'Muchos árboles que votan compensan lo que memoriza cada uno: es el remedio clásico para un árbol que sobreajusta.'];
            return ['meh', alg === 'random_forest' ? 'Ya estás usando Random Forest.' : 'No hay sobreajuste que corregir: cambiar de modelo no hace falta.'];
          } },
        { id: 'seguir', ficha: 'split', texto: 'Seguir con este modelo',
          evaluar: (ctx) => {
            const { train, test, sobre } = rendimiento(ctx);
            return sobre
              ? ['bad', `${pct(train)} en entrenamiento y ${pct(test)} en prueba es sobreajuste: con clientes nuevos va a fallar mucho más de lo que parece.`]
              : ['ok', `Entrenamiento ${pct(train)} y prueba ${pct(test)} están cerca: el modelo generaliza a clientes que no vio.`];
          } },
        { id: 'train', ficha: 'evaluar_train', texto: 'Informarle a Ana el resultado de entrenamiento, que es el más alto',
          evaluar: (ctx) => ['bad', `El ${pct(rendimiento(ctx).train)} de entrenamiento mide clientes que el modelo ya vio. Lo que importa es cómo le va con los nuevos: la prueba.`] },
      ],
    },
    {
      id: 'metrica', titulo: 'Métrica', habla: 'cliente',
      dialogo: () => 'Te cuento cómo es el negocio: una llamada con la oferta nos cuesta unos minutos de un operador. Si llamamos a alguien que no se iba a ir, no pasa nada. Pero cada cliente que se va sin que lo llamemos son años de abono perdidos.',
      pregunta: () => '¿Con qué métrica medís el modelo?',
      muestra: ({ datos }) => chips([`se dieron de baja: ${pct(datos.bajas / N)}`, 'llamada: barata', 'cliente perdido: carísimo']),
      opciones: [
        { id: 'exactitud', ficha: 'exactitud',
          evaluar: ({ datos }) => ['bad', `Un modelo que diga "nadie se va" ya acierta el ${pct(1 - datos.bajas / N)}… y no detecta ni una baja. Con desbalance, aunque sea moderado, engaña.`] },
        { id: 'sensibilidad', ficha: 'sensibilidad',
          evaluar: () => ['ok', 'Lo caro para Ana es el cliente que se va sin llamada: un falso negativo. La sensibilidad mide cuántas bajas reales detectás.'] },
        { id: 'f1', ficha: 'f1',
          evaluar: () => ['meh', 'Es buena con desbalance, pero castiga igual las llamadas de más, que acá son baratas. La sensibilidad apunta justo al error caro.'] },
        { id: 'precision', ficha: 'precision',
          evaluar: () => ['bad', 'Cuida las llamadas de más (falsos positivos), que para Ana son el error barato. Te dejaría escapar clientes por no "molestar".'] },
        { id: 'especificidad', ficha: 'especificidad',
          evaluar: () => ['bad', 'Mide cuántos de los que se quedan reconocés. A Ana le importan los que se van.'] },
      ],
    },
    {
      id: 'historia', titulo: 'Directorio', habla: 'cliente',
      dialogo: () => 'El jueves presento esto en el directorio. Son 15 minutos y nadie es técnico. ¿Qué les muestro?',
      muestra: ({ datos }) => {
        const t = datos.tasaReclamos;
        return bloque(chips(['audiencia: directorio', '15 minutos', 'no técnicos']),
          graficos(figura(Graf.barras(t, ['--acento', '--acento', '--meh', '--bad']), `Tu análisis · tasa de baja según reclamos: 0 → ${pct(t[0])} · 1 → ${pct(t[1])} · 2 → ${pct(t[2])} · 3 o más → ${pct(t[3])}`)));
      },
      opciones: [
        { id: 'barras', ficha: 'storytelling', texto: 'Barras de tasa de baja por reclamos, con un título que cuenta el hallazgo y propone una acción',
          evaluar: ({ datos }) => ['ok', `Una sola historia con inicio, nudo y desenlace: con 3 o más reclamos se va el ${pct(datos.tasaReclamos[3])}, contra ${pct(datos.tasaReclamos[0])} sin reclamos. La acción: llamar primero a los que reclaman.`] },
        { id: 'tabla', ficha: 'telefonica_visual_pobre', texto: 'Una tabla con las 30 columnas del modelo',
          evaluar: () => ['bad', 'Satura: el directorio no sabe dónde mirar y el hallazgo se pierde entre 30 columnas. No hay historia ni acción.'] },
        { id: 'torta', ficha: 'telefonica_visual_pobre', texto: 'Una torta 3D con 12 porciones',
          evaluar: () => ['bad', 'Doce porciones no se pueden comparar a ojo y el 3D deforma los tamaños. Además, no propone ninguna acción.'] },
        { id: 'matriz', ficha: 'telefonica_audiencia', texto: 'La matriz de confusión del modelo, tal cual',
          evaluar: () => ['meh', 'Es correcta y a vos te sirve, pero un directorio no técnico no lee VP y FN. Falta la historia y, sobre todo, la acción.'] },
      ],
    },
  ],

  final(ctx) {
    const { datos, decisiones, notas, rasgos } = ctx;
    const calidad = Juego.calidad(notas.filter((n) => !['metrica', 'historia'].includes(n.id)));
    const r = rendimiento(ctx, true), sobre = r.sobre;
    const sigueSobre = sobre && !['limitar', 'rf'].includes(decisiones.ajuste);
    const bajas = Math.max(5, Math.round(PRUEBA * datos.bajas / N)), quedan = PRUEBA - bajas;
    const ajuste = { sensibilidad: [.1, .22], f1: [0, .14], precision: [-.15, .06], exactitud: [-.25, .05], especificidad: [-.3, .03] }[decisiones.metrica];
    const sens = clamp(.45 + .4 * calidad + ajuste[0] - (sigueSobre ? .15 : 0), 0, .97);
    const tasaFp = clamp(ajuste[1] - .08 * calidad + (sigueSobre ? .1 : 0), .01, 1);
    const vp = Math.round(bajas * sens), fp = Math.round(quedan * tasaFp);
    const matriz = { vp, fp, fn: bajas - vp, vn: quedan - fp }, m = metricasClasif(matriz);
    const train = clamp(m.exactitud + Math.max(.02, r.train - r.test), 0, 1);   // misma brecha que en la etapa de ajuste

    const consecuencias = [];
    if (decisiones.nulos === 'cero' && !rasgos.nulosNuevos) consecuencias.push('Los clientes con años de antigüedad y total en 0 parecían recién llegados: el modelo los confundió.');
    if (['mediana', 'media'].includes(decisiones.nulos) && rasgos.nulosNuevos) consecuencias.push('A los clientes nuevos les inventaste una deuda: el modelo los vio como clientes viejos y no detectó su riesgo.');
    if (decisiones.nulos === 'borrar' && rasgos.nulosNuevos) consecuencias.push('Sin clientes nuevos en el entrenamiento, el modelo no sabe qué hacer con los que recién llegan, el grupo que más se va.');
    if (['label', 'target'].includes(decisiones.encoding)) consecuencias.push(decisiones.encoding === 'label' ? 'Label encoding inventó un orden entre formas de pago que no existe.' : 'Target encoding metió la baja dentro de las entradas: la prueba salió mejor de lo que el modelo es en realidad.');
    if (decisiones.multicol === 'nada') consecuencias.push('Con total, meses y mensual repitiendo información, los coeficientes salieron inestables y no se pudo explicar qué pesa.');
    if (sigueSobre) consecuencias.push(`El árbol siguió memorizando: ${pct(train)} en entrenamiento, pero con clientes nuevos se equivoca mucho más.`);
    if (decisiones.ajuste === 'train') consecuencias.push('Le informaste a Ana el número de entrenamiento: esperaba más aciertos de los que tuvo en la realidad.');
    if (['exactitud', 'especificidad', 'precision'].includes(decisiones.metrica)) consecuencias.push('Optimizaste una métrica que no cuida el error caro: se escaparon clientes que se podían retener.');
    if (['tabla', 'torta'].includes(decisiones.historia)) consecuencias.push('El directorio no entendió el hallazgo y postergó el presupuesto para las llamadas.');

    const malaHistoria = ['tabla', 'torta'].includes(decisiones.historia);
    const reaccion = (m.sensibilidad >= .8 ? `¡Detectamos ${vp} de ${bajas} bajas a tiempo! Así sí vale la pena llamar.`
      : m.sensibilidad >= .6 ? `Detecta ${vp} de ${bajas} bajas. Sirve, pero todavía se nos escapan clientes.`
        : `Solo ${vp} de ${bajas} bajas detectadas: se nos siguen yendo sin que los llamemos.`)
      + (malaHistoria ? ' Y en el directorio nadie entendió la presentación.' : '');
    return {
      titulo: `Resultado en ${PRUEBA} clientes de prueba`,
      reaccion, exito: m.sensibilidad >= .6 && !malaHistoria,
      resultado: bloque(
        matrizConfusion(matriz, 'baja', 'se queda'),
        html('<div class="mt"></div>'),
        chips([`sensibilidad ${pct(m.sensibilidad)}`, `precisión ${pct(m.precision)}`]),
        chips([`exactitud en entrenamiento ${pct(train)}`, `exactitud en prueba ${pct(m.exactitud)}`]),
        ...(consecuencias.length ? [html('<h2 class="mt">Consecuencias</h2>'), lista(consecuencias)] : []),
      ),
    };
  },
});
})();


/* ════════════ Libro de fichas ════════════ */
const Libro = {
  usadas() {                            // solo cuentan las fichas que aparecen en algún caso
    const claves = new Set();
    CASOS.forEach((c) => c.etapas.forEach((e) => e.opciones.forEach((o) => claves.add(o.ficha))));
    return [...claves].filter((k) => FICHAS[k]);
  },
  desbloqueadas() { return new Set(Progreso.leer().fichas || []); },
  desbloquear(clave) {
    const tengo = this.desbloqueadas();
    if (tengo.has(clave) || !FICHAS[clave]) return;
    Progreso.actualizar({ fichas: [...tengo, clave] });
    Aviso.mostrar(`★ Ficha nueva: ${FICHAS[clave].titulo}`);
    Sonido.efecto('ficha');
  },
  cuenta() {
    const tengo = this.desbloqueadas(), usadas = this.usadas();
    return `${usadas.filter((k) => tengo.has(k)).length}/${usadas.length}`;
  },
  abrir() {
    const tengo = this.desbloqueadas(), usadas = this.usadas(), temas = {};
    usadas.forEach((k) => (temas[FICHAS[k].tema] ??= []).push(k));
    $('#libro-titulo').textContent = `Libro de fichas · ${usadas.filter((k) => tengo.has(k)).length}/${usadas.length}`;
    $('#libro-cuerpo').replaceChildren(nota('Se desbloquean al leer una ficha (?) o al elegir esa opción.'), ...Object.entries(temas).map(([tema, claves]) => html(`
      <h2 class="libro-tema">${tema}</h2>
      <ul class="libro-lista">${claves.map((k) => (tengo.has(k)
        ? `<li><b>${FICHAS[k].titulo}</b>${FICHAS[k].texto}</li>`
        : '<li class="bloqueada"><b>???</b>Todavía no la encontraste.</li>')).join('')}</ul>`)));
    $('#libro').showModal();
  },
};

const Aviso = {
  timer: null,
  mostrar(texto) {
    const a = $('#aviso');
    a.textContent = texto; a.hidden = false;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { a.hidden = true; }, 2600);
  },
};

/* ════════════ Partidas guardadas: una por caso, para poder dejar uno a medias y retomarlo ════════════ */
const Partidas = {
  todas() { return Progreso.leer().partidas || {}; },
  de(id) { return CASOS.some((c) => c.id === id) ? this.todas()[id] : undefined; },
  guardar(id, partida) { Progreso.actualizar({ partidas: { ...this.todas(), [id]: partida }, ultima: id }); },
  borrar(id) { const t = this.todas(); delete t[id]; Progreso.actualizar({ partidas: t }); },
  ultima() { const id = Progreso.leer().ultima; return id && this.de(id); },
  etapa(g) { return CASOS.find((c) => c.id === g.caso).etapas[g.i]?.titulo; },
};

/* ════════════ Motor ════════════ */
const Juego = {
  caso: null, partida: null,

  iniciar(caso, semilla = Math.floor(Math.random() * 1e6)) {
    this.cargar({ caso: caso.id, semilla, decisiones: {}, efectivos: {}, notas: [], i: 0 });
  },

  // Los datos no se guardan: se regeneran igual a partir de la semilla
  cargar({ caso: id, semilla, decisiones, efectivos = {}, notas, i }) {
    const caso = CASOS.find((c) => c.id === id);
    if (!caso) return Menu.mostrar();
    this.caso = caso;
    Sonido.preparar();
    if (Config.musica) Sonido.tocarMusica(true);
    const datos = caso.generar(azar(semilla));
    this.partida = { semilla, datos, rasgos: datos.rasgos, decisiones, efectivos, notas, i: i - 1 };
    Escena.cliente = caso.cliente.sprite;
    Escena.dibujar();
    $('#hud').hidden = false;
    $('#barra-sup').hidden = false;
    $('#hud-caso').innerHTML = caso.nombre + (caso.nivel === 'desafio' ? '<span class="etiqueta desafio">DESAFÍO</span>' : '');
    this.siguiente();
  },

  contexto() {
    const p = this.partida;
    return {
      datos: p.datos, rasgos: p.rasgos, decisiones: p.decisiones, notas: p.notas, semilla: p.semilla,
      elegido: (id) => p.efectivos[id] ?? p.decisiones[id],      // lo que quedó en pie tras una corrección
      calidad: this.calidad(),
    };
  },

  calidad(notas = this.partida.notas) {
    return notas.length ? notas.reduce((a, x) => a + NIVEL[x.nivel].puntos, 0) / notas.length : 1;
  },

  visibles() { return this.caso.etapas.filter((e) => !e.si || e.si(this.contexto())); },

  hud() {
    const vis = this.visibles(), etapa = this.caso.etapas[this.partida.i];
    $('#hud-etapa').textContent = etapa ? `${vis.indexOf(etapa) + 1}/${vis.length} ${etapa.titulo}` : 'Resultado';
    const llenos = Math.round(this.calidad() * 8);
    const barra = $('#hud-calidad');
    barra.replaceChildren(...Array.from({ length: 8 }, (_, i) => Object.assign(document.createElement('i'), { className: i < llenos ? 'on' : '' })));
    barra.setAttribute('aria-label', `${llenos} de 8`);
  },

  decir(etapaHabla, texto) {
    const c = this.caso.cliente;
    if (etapaHabla === 'cliente') Dialogo.decir(c.sprite, c.nombre, texto, c.voz);
    else Dialogo.decir('vos', 'Vos', texto, 330);
  },

  siguiente() {
    const p = this.partida, etapas = this.caso.etapas;
    do { p.i++; } while (p.i < etapas.length && etapas[p.i].si && !etapas[p.i].si(this.contexto()));
    if (p.i >= etapas.length) return this.terminar();
    const { semilla, decisiones, efectivos, notas, i } = p;
    Partidas.guardar(this.caso.id, { caso: this.caso.id, semilla, decisiones, efectivos, notas, i });
    this.mostrarEtapa(etapas[p.i]);
  },

  mostrarEtapa(etapa) {
    const ctx = this.contexto();
    this.hud();
    this.decir(etapa.habla, etapa.dialogo(ctx));
    const pizarra = html(`<section class="caja"><h2>Pizarra · ${etapa.titulo}</h2></section>`);
    pizarra.firstChild.append(etapa.muestra(ctx));
    const pregunta = etapa.pregunta ? etapa.pregunta(ctx) : (etapa.tipo === 'multi' ? 'Marcá todo lo que notes en los datos.' : '¿Qué elegís?');
    const panel = html(`<section class="caja"><h2>Tu decisión</h2><p class="pregunta">${pregunta}</p><div class="opciones"></div><div class="acciones"></div></section>`).firstChild;
    const lista_ = panel.querySelector('.opciones');
    mezclar(etapa.opciones).forEach((op, k) => lista_.append(this.opcion(op, k, etapa, panel)));
    if (etapa.tipo === 'multi') {
      const ok = html('<button class="btn-acento" type="button">Confirmar</button>').firstChild;
      ok.onclick = () => this.resolverMulti(etapa, panel);
      panel.querySelector('.acciones').append(ok);
    }
    $('#contenido').replaceChildren(pizarra, panel);
    lista_.querySelector('button').focus({ preventScroll: true });
    scrollTo({ top: 0, behavior: quieto ? 'auto' : 'smooth' });
  },

  opcion(op, k, etapa, panel) {
    const ficha = FICHAS[op.ficha], texto = this.textoOpcion(op);
    const nodo = html(`<div class="opcion" data-id="${op.id}">
      <button type="button">${etapa.tipo === 'multi' ? '<span class="check" aria-hidden="true"></span>' : `<span class="num">${k + 1}</span>`}<span>${texto}</span></button>
      <button type="button" class="btn-ficha" aria-expanded="false" aria-label="Ficha: ${ficha.titulo}">?</button>
      <p class="ficha" hidden><span class="sello">Ficha · ${ficha.titulo}</span>${ficha.texto}</p></div>`).firstChild;
    const [elegir, verFicha] = nodo.querySelectorAll('button'), cuadro = nodo.querySelector('.ficha');
    verFicha.onclick = () => {
      cuadro.hidden = !cuadro.hidden;
      verFicha.setAttribute('aria-expanded', String(!cuadro.hidden));
      Sonido.efecto('pagina');
      Libro.desbloquear(op.ficha);
    };
    elegir.onclick = () => {
      if (panel.classList.contains('resuelta')) return;
      if (etapa.tipo !== 'multi') return this.resolver(etapa, op, panel);
      const on = elegir.classList.toggle('marcada');
      elegir.setAttribute('aria-pressed', String(on));
      Sonido.efecto('clic');
    };
    if (etapa.tipo === 'multi') elegir.setAttribute('aria-pressed', 'false');
    return nodo;
  },

  textoOpcion(op) {                     // texto fijo, función de ctx o, si falta, el título de la ficha
    return typeof op.texto === 'function' ? op.texto(this.contexto()) : op.texto ?? FICHAS[op.ficha].titulo;
  },

  explicar(nodo, nivel, texto, oculta = false) {
    nodo.querySelector('.ficha').hidden = true;
    nodo.querySelector('.btn-ficha').setAttribute('aria-expanded', 'false');
    const por = html(`<p class="por ${nivel}"><span class="sello">${NIVEL[nivel].sello}</span>${texto}</p>`).firstChild;
    por.hidden = oculta;
    nodo.append(por);
  },

  resolver(etapa, elegida, panel) {
    const ctx = this.contexto();
    panel.classList.add('resuelta');
    let resultado, ocultas = 0;
    etapa.opciones.forEach((op) => {
      const [nivel, texto] = op.evaluar(ctx), nodo = panel.querySelector(`[data-id="${op.id}"]`);
      const visible = op === elegida || nivel === 'ok';          // primero tu elección y la correcta
      this.explicar(nodo, nivel, texto, !visible);
      if (!visible) ocultas++;
      if (op === elegida) { resultado = nivel; nodo.querySelector('button').classList.add('marcada'); }
    });
    if (ocultas) {
      const ver = html('<button type="button" class="btn-texto">Ver por qué las otras opciones</button>').firstChild;
      ver.onclick = () => { panel.querySelectorAll('.por[hidden]').forEach((x) => { x.hidden = false; }); ver.remove(); };
      panel.querySelector('.opciones').after(ver);
    }
    const p = this.partida;
    p.decisiones[etapa.id] = elegida.id;
    if (elegida.efectivo) p.efectivos[etapa.id] = elegida.efectivo;
    p.notas.push({ id: etapa.id, etapa: etapa.titulo, eleccion: this.textoOpcion(elegida), nivel: resultado });
    Libro.desbloquear(elegida.ficha);
    Sonido.efecto(resultado);
    this.cerrarEtapa(panel, resultado);
  },

  resolverMulti(etapa, panel) {
    const ctx = this.contexto();
    panel.classList.add('resuelta');
    let errores = 0;
    const marcadas = [];
    etapa.opciones.forEach((op) => {
      const nodo = panel.querySelector(`[data-id="${op.id}"]`), marcada = nodo.querySelector('.marcada') !== null, real = op.real(ctx);
      if (marcada) marcadas.push(op);
      if (marcada !== real) errores++;
      const si = typeof op.si === 'function' ? op.si(ctx) : op.si, no = typeof op.no === 'function' ? op.no(ctx) : op.no;
      const texto = real ? (marcada ? si : `Se te pasó. ${si}`) : (marcada ? `No. ${no}` : `Bien descartado. ${no}`);
      this.explicar(nodo, marcada === real ? 'ok' : 'bad', texto);
    });
    const nivel = errores === 0 ? 'ok' : errores === 1 ? 'meh' : 'bad';
    this.partida.decisiones[etapa.id] = marcadas.map((o) => o.id);
    this.partida.notas.push({ id: etapa.id, etapa: etapa.titulo, eleccion: marcadas.map((o) => this.textoOpcion(o)).join(' · ') || 'nada marcado', nivel });
    marcadas.forEach((o) => Libro.desbloquear(o.ficha));
    panel.querySelector('.acciones').replaceChildren();
    Sonido.efecto(nivel);
    this.cerrarEtapa(panel, nivel, errores ? `${errores} ${errores === 1 ? 'observación equivocada' : 'observaciones equivocadas'}.` : 'Viste todo lo importante.');
  },

  cerrarEtapa(panel, nivel, extra = '') {
    this.hud();
    const textos = { ok: 'Muy bien.', meh: 'Se puede, pero había una opción mejor.', bad: 'Esa decisión va a tener consecuencias…' };
    const cierre = html(`<div class="acciones"><p class="veredicto">${extra || textos[nivel]}</p><button class="btn-acento" type="button">Continuar ▶</button></div>`);
    const boton = cierre.querySelector('button');
    boton.onclick = () => { Sonido.efecto('clic'); this.siguiente(); };
    panel.querySelector('.acciones').replaceWith(cierre);
    boton.focus({ preventScroll: true });
    panel.querySelector('.marcada')?.scrollIntoView({ block: 'start', behavior: quieto ? 'auto' : 'smooth' });
  },

  terminar() {
    const p = this.partida, caso = this.caso, calidad = this.calidad();
    const r = caso.final(this.contexto());
    this.hud();
    this.decir('cliente', r.reaccion);
    const rango = calidad >= .9 ? 'Analista senior' : calidad >= .7 ? 'Analista semi senior' : calidad >= .45 ? 'Analista junior' : 'Pasante';
    const prog = Progreso.leer(), records = { ...prog.records, [caso.id]: Math.max(prog.records?.[caso.id] || 0, calidad) };
    Progreso.actualizar({ records });
    Partidas.borrar(caso.id);
    Sonido.efecto(r.exito ? 'victoria' : 'derrota');
    const resultado = html(`<section class="caja"><h2>${r.titulo}</h2></section>`);
    resultado.firstChild.append(r.resultado);
    const recorrido = html(`
      <section class="caja"><h2>Tu recorrido · ${rango} (${pct(calidad)})</h2>
        <ol class="resumen">${p.notas.map((n) => `<li class="${n.nivel}"><span class="sello ${n.nivel}">${NIVEL[n.nivel].sello}</span>${n.etapa}: ${n.eleccion}</li>`).join('')}</ol>
        <p class="nota">Partida #${p.semilla} · mejor puntaje en este caso: ${pct(records[caso.id])}</p>
        <div class="acciones">
          <button type="button" id="otro-caso">☰ Otro caso</button>
          <button type="button" id="repetir">↺ Mismos datos, otro camino</button>
          <button type="button" class="btn-acento" id="nueva">▶ Datos nuevos</button>
        </div>
      </section>`);
    $('#contenido').replaceChildren(resultado, recorrido);
    $('#otro-caso').onclick = () => Menu.casos();
    $('#repetir').onclick = () => this.iniciar(caso, p.semilla);
    $('#nueva').onclick = () => this.iniciar(caso);
    $('#nueva').focus({ preventScroll: true });
    scrollTo({ top: 0, behavior: quieto ? 'auto' : 'smooth' });
  },
};

/* ════════════ Menú principal y selector de casos ════════════ */
const Menu = {
  preparar() {
    Escena.cliente = null; Escena.dibujar();
    $('#hud').hidden = true;
  },

  mostrar() {
    this.preparar();
    $('#barra-sup').hidden = true;
    Dialogo.decir('vos', 'Vos', '¡Bienvenido a la consultora! Elegí un caso o retomá el que dejaste.');
    const g = Partidas.ultima(), caso = g && CASOS.find((c) => c.id === g.caso);
    $('#contenido').replaceChildren(html(`
      <section class="caja portada">
        <h1>CONSULTORA DE DATOS</h1>
        <p>Llegan clientes con un problema y un dataset. Vos decidís cada paso, y cada decisión te explica por qué.</p>
        <div class="menu">
          ${g ? `<button type="button" class="btn-acento" id="menu-continuar">▶ Continuar<small>${caso.nombre} · ${Partidas.etapa(g)}</small></button>` : ''}
          <button type="button" class="${g ? '' : 'btn-acento'}" id="menu-casos">☰ Casos<small>${CASOS.length} casos · ${Object.keys(Partidas.todas()).filter((id) => Partidas.de(id)).length} en curso</small></button>
          <button type="button" id="menu-libro">★ Libro de fichas<small>${Libro.cuenta()} conceptos</small></button>
          <button type="button" id="menu-musica">♪ Música<small></small></button>
          <button type="button" id="menu-efectos">✦ Efectos<small></small></button>
        </div>
        <details class="como-jugar">
          <summary>¿Cómo se juega?</summary>
          <ul>
            <li>Cada caso tiene etapas: el problema, el EDA, la limpieza… En cada una mirás la pizarra con los datos y elegís.</li>
            <li>Tocá <span class="tecla">?</span> para leer la ficha de una opción antes de elegir.</li>
            <li>Las malas decisiones no te frenan, pero tienen consecuencias en el resultado final.</li>
            <li>Los datos cambian en cada partida: mirá antes de elegir.</li>
            <li>Con <span class="tecla">☰ Menú</span> salís cuando quieras: el avance de cada caso se guarda solo y lo retomás después.</li>
            <li>En compu: teclas <span class="tecla">1</span>–<span class="tecla">5</span> para elegir y <span class="tecla">Esc</span> para volver al menú.</li>
          </ul>
        </details>
        <p class="nota creditos">By F. Suárez · 2026 · Saludos pal IFTS 24 · <a href="https://fedetrus.github.io/guias/">Más guías</a></p>
      </section>`));
    Config.pintar();
    if (g) $('#menu-continuar').onclick = () => { Sonido.efecto('clic'); Juego.cargar(g); };
    $('#menu-casos').onclick = () => { Sonido.preparar(); Sonido.efecto('clic'); this.casos(); };
    $('#menu-libro').onclick = () => { Sonido.preparar(); Sonido.efecto('pagina'); Libro.abrir(); };
    $('#menu-musica').onclick = () => Config.cambiar('musica');
    $('#menu-efectos').onclick = () => Config.cambiar('efectos');
    $('.menu button').focus({ preventScroll: true });
    scrollTo({ top: 0 });
  },

  casos() {
    this.preparar();
    $('#barra-sup').hidden = false;
    Dialogo.decir('vos', 'Vos', '¿Con qué cliente sigo? Los desafíos combinan varios problemas a la vez.');
    const records = Progreso.leer().records || {};
    const tarjeta = (c) => {
      const g = Partidas.de(c.id), hecho = records[c.id] !== undefined;
      const estado = g ? `<span class="etiqueta">EN CURSO</span> ${Partidas.etapa(g)}`
        : hecho ? `<span class="etiqueta hecho">HECHO</span> mejor: ${pct(records[c.id])}` : 'Sin jugar';
      const botones = g
        ? `<button type="button" class="btn-acento" data-continuar="${c.id}">▶ Continuar</button><button type="button" data-jugar="${c.id}">Empezar de nuevo</button>`
        : `<button type="button" class="${hecho ? '' : 'btn-acento'}" data-jugar="${c.id}">▶ ${hecho ? 'Jugar otra vez' : 'Jugar'}</button>`;
      return `<div class="caso-tarjeta">
        <canvas width="12" height="16" data-sprite="${c.cliente.sprite}" aria-hidden="true"></canvas>
        <span class="pix">${c.orden}. ${c.nombre}</span>
        <small>${c.resumen}</small>
        <small>${estado}</small>
        <div class="caso-botones">${botones}</div>
      </div>`;
    };
    const grupo = (nivel) => CASOS.filter((c) => c.nivel === nivel).sort((a, b) => a.orden - b.orden).map(tarjeta).join('');
    $('#contenido').replaceChildren(html(`
      <section class="caja"><div class="cab-casos"><h2>Casos</h2><button type="button" id="casos-menu">← Menú</button></div>
        <div class="casos">${grupo('normal')}</div>
        <h2>Desafíos <span class="etiqueta desafio">MÁS DIFÍCIL</span></h2>
        <p class="nota" style="margin:0 0 var(--e-2)">Datos menos obvios, varios problemas juntos y un cliente que no habla en términos técnicos.</p>
        <div class="casos">${grupo('desafio')}</div>
      </section>`));
    document.querySelectorAll('[data-sprite]').forEach((c) => dibujarSprite(c.getContext('2d'), SPRITES[c.dataset.sprite], 0, 0));
    const caso = (id) => CASOS.find((c) => c.id === id);
    document.querySelectorAll('[data-jugar]').forEach((b) => {
      b.onclick = () => { Sonido.efecto('clic'); Juego.iniciar(caso(b.dataset.jugar)); };
    });
    document.querySelectorAll('[data-continuar]').forEach((b) => {
      b.onclick = () => { Sonido.efecto('clic'); Juego.cargar(Partidas.de(b.dataset.continuar)); };
    });
    $('#casos-menu').onclick = () => { Sonido.efecto('clic'); this.mostrar(); };
    $('.caso-botones button').focus({ preventScroll: true });
    scrollTo({ top: 0 });
  },
};

/* ════════════ Teclado y arranque ════════════ */
addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || $('#libro').open) return;
  if (e.key === 'Escape' && !$('#barra-sup').hidden) return Menu.mostrar();
  const n = Number(e.key);
  const panel = document.querySelector('#contenido .opciones')?.closest('section');
  if (!panel || panel.classList.contains('resuelta')) return;
  const opciones = panel.querySelectorAll('.opcion > button:first-child');
  if (n >= 1 && n <= opciones.length) opciones[n - 1].click();
});

// Las versiones anteriores guardaban una sola partida: se pasa al formato de una por caso
const vieja = Progreso.leer().partida;
if (vieja) { Partidas.guardar(vieja.caso, vieja); Progreso.actualizar({ partida: undefined }); }

Config.cargar();
$('#btn-menu').onclick = () => { Sonido.efecto('clic'); Menu.mostrar(); };
$('#cerrar-libro').onclick = () => { $('#libro').close(); if (!$('#menu-libro')) return; Menu.mostrar(); };
Menu.mostrar();
</script>
</body>
</html>
